<style>
/* Layout: one single-column working page for a phone or a laptop. A sticky strip names the student and holds the 11 numbered steps, which match the tutor's board and the paper packet. Steps that use the screen show a SCREEN banner; the others tell the student to put the screen down. */
:root {
  --bg: #F3F5FA; --panel: #FFFFFF; --panel2: #E8ECF5; --ink: #14213D; --muted: #55627E; --line: #C9D1E3;
  --accent: #2457D6; --accent-ink: #FFFFFF; --good: #17804A; --good-bg: #DDF3E6; --bad: #B83232; --bad-bg: #F9E0E0;
  --gold: #8F6200; --gold-bg: #FAEFCB; --paper: #7A3E00; --paper-bg: #FDEBD3;
  --f-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif; --f-body: 'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0D1526; --panel: #15213B; --panel2: #1D2C4D; --ink: #E8EEFA; --muted: #9DAAC6; --line: #2C3C60;
    --accent: #88AAFF; --accent-ink: #0D1526; --good: #5BD593; --good-bg: #12392B; --bad: #FF8E8E; --bad-bg: #40191F;
    --gold: #F2C35B; --gold-bg: #3A2D0E; --paper: #FFC88A; --paper-bg: #3D2A12; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0D1526; --panel: #15213B; --panel2: #1D2C4D; --ink: #E8EEFA; --muted: #9DAAC6; --line: #2C3C60;
  --accent: #88AAFF; --accent-ink: #0D1526; --good: #5BD593; --good-bg: #12392B; --bad: #FF8E8E; --bad-bg: #40191F;
  --gold: #F2C35B; --gold-bg: #3A2D0E; --paper: #FFC88A; --paper-bg: #3D2A12; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; overflow-x: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h2 { font-size: 1.45rem; } h3 { font-size: 1.1rem; } p { margin: 0; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px 8px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: .78rem; color: var(--muted); }
.who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: .9rem; }
.who b { font-family: var(--f-display); background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 12px; }
.linkbtn { background: none; border: 0; color: var(--accent); text-decoration: underline; padding: 4px; font-size: .9rem; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-block: 8px 2px; scrollbar-width: thin; }
.tab { flex: 0 0 auto; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 5px 13px; font-size: .9rem; white-space: nowrap; }
.tab.scr { border-color: var(--accent); }
.tab.off { border-style: dashed; color: var(--muted); }
.tab[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; border-style: solid; }
.tab .tick { color: var(--good); font-weight: 800; margin-left: 4px; }
.tab[aria-current="true"] .tick { color: var(--accent-ink); }
main { display: flex; flex-direction: column; gap: 16px; padding-top: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.lede { color: var(--muted); }
.banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-radius: 12px; padding: 10px 14px; border: 2px solid var(--accent); background: var(--panel2); }
.banner .n { font-family: var(--f-display); font-weight: 800; letter-spacing: .08em; font-size: .78rem; }
.banner b { font-family: var(--f-display); font-size: 1.1rem; }
.banner .tags { margin-left: auto; font-family: var(--f-display); font-weight: 800; letter-spacing: .1em; font-size: .78rem; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 2px 10px; }
.banner.off { border-color: var(--paper); background: var(--paper-bg); }
.banner.off .tags { background: var(--paper); color: var(--paper-bg); }
.down { border: 3px solid var(--paper); background: var(--paper-bg); border-radius: 12px; padding: 14px 16px; font-size: 1.1rem; }
.down b { font-family: var(--f-display); letter-spacing: .06em; }
.cat { font-family: var(--f-display); font-weight: 700; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.stem { font-family: var(--f-display); font-weight: 700; font-size: 1.12rem; line-height: 1.35; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0; }
.opt .n { font-family: var(--f-display); font-weight: 800; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--panel2); }
.opt .t { padding-top: 3px; overflow-wrap: anywhere; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--panel2); }
.opt[aria-pressed="true"] .n { background: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.right .n { background: var(--good); color: var(--bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .n { background: var(--bad); color: var(--bg); }
.opt .why { grid-column: 2; font-size: .95rem; color: var(--muted); }
.opt.wrong .why, .opt.right .why { color: var(--ink); }
.opt:disabled { cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 9px 16px; font-weight: 700; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.explain { border-left: 6px solid var(--good); background: var(--good-bg); border-radius: 8px; padding: 12px 14px; }
.explain.warn { border-color: var(--gold); background: var(--gold-bg); }
.explain b.h { font-family: var(--f-display); letter-spacing: .06em; text-transform: uppercase; font-size: .72rem; display: block; margin-bottom: 2px; }
.pts { font-family: var(--f-display); font-weight: 800; }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.6rem; font-weight: 700; letter-spacing: .06em; background: var(--panel2); border: 2px dashed var(--accent); border-radius: 12px; padding: 12px 16px; overflow-wrap: anywhere; }
.lock { display: flex; flex-direction: column; gap: 12px; }
.lock input { font-size: 1.3rem; text-transform: uppercase; letter-spacing: .1em; padding: 10px 14px; border: 2px solid var(--line); border-radius: 10px; background: var(--panel); width: min(100%, 320px); }
.err { color: var(--bad); font-weight: 700; min-height: 1.4em; }
.passage { display: flex; flex-direction: column; gap: 12px; max-width: 65ch; }
.rk { font-family: var(--f-display); font-weight: 800; background: var(--gold-bg); color: var(--gold); border: 2px solid var(--gold); border-radius: 8px; padding: 0 10px; margin-left: 8px; }
.score { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; }
.pick { display: grid; place-items: center; gap: 14px; padding-block: 30px; text-align: center; }
.pick .letters { display: flex; gap: 12px; }
.pick .letters button { width: 72px; height: 72px; font-size: 1.8rem; font-family: var(--f-display); font-weight: 800; border-radius: 16px; background: var(--panel); border: 2px solid var(--line); }
.pick .letters button:hover { border-color: var(--accent); }
.term { border: 1px solid var(--line); border-left: 6px solid var(--accent); border-radius: 10px; padding: 10px 14px; background: var(--panel); display: flex; flex-direction: column; gap: 4px; }
.term h4 { margin: 0; font-family: var(--f-display); font-size: 1rem; }
.term .ex { background: var(--panel2); border-radius: 8px; padding: 8px 12px; font-size: .97rem; overflow-wrap: anywhere; }
.rule { border: 1px solid var(--line); border-left: 6px solid var(--gold); border-radius: 10px; padding: 12px 14px; background: var(--panel); display: flex; flex-direction: column; gap: 6px; }
.rule h4 { margin: 0; font-family: var(--f-display); font-size: 1.05rem; }
.rule .id { font-family: var(--f-display); font-weight: 800; background: var(--gold-bg); color: var(--gold); border-radius: 6px; padding: 0 8px; margin-right: 8px; }
.pair { display: grid; gap: 6px; }
.pair .w, .pair .r { border-radius: 8px; padding: 8px 12px; overflow-wrap: anywhere; }
.pair .w { background: var(--bad-bg); } .pair .r { background: var(--good-bg); }
.pair .lab { font-family: var(--f-display); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; display: block; color: var(--muted); }
details.tm { border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; }
details.tm > summary { cursor: pointer; font-weight: 700; color: var(--accent); }
details.tm[open] > summary { margin-bottom: 8px; }
details.tm > * + * { margin-top: 8px; }
.wc { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; background: var(--panel); }
.wc h4 { margin: 0; font-family: var(--f-display); font-size: 1.15rem; }
.wc .p { color: var(--muted); font-size: .92rem; }
.rules-box { background: var(--panel2); border-radius: 10px; padding: 10px 14px; }
.book { display: flex; flex-direction: column; gap: 8px; }
.book .meta { color: var(--muted); font-size: .9rem; }
.synopsis { font-size: 1rem; }
@media (max-width: 480px) { .stem { font-size: 1.05rem; } .code { font-size: 1.3rem; } }
@media (prefers-reduced-motion: no-preference) { .opt { transition: border-color .15s, background .15s; } }
</style>

<script>
var D = {"meta":{"date":"2026.11.07","unit":"Nation","lesson":"Lesson 7 + Bridge","version":"v3","key":"nation-l7-v3"},"scoring":{"correct":2,"streakAt":3,"streakBonus":1,"roundWin":2},"steps":[{"n":1,"id":"s1","name":"Homework check","short":"Homework","tags":["TALK"],"min":6,"students":"Screens down. Books closed."},{"n":2,"id":"s2","name":"Themes and your life","short":"Themes","tags":["TALK","PAPER"],"min":16,"students":"Screens down. Paper sheet, front, STEP 2 boxes. Books closed until the reread."},{"n":3,"id":"s3","name":"Vocabulary contest","short":"Vocab contest","tags":["SCREEN"],"min":10,"students":"Screens up. Student Page, tab 3."},{"n":4,"id":"s4","name":"Punctuation: learn the rules","short":"Rules","tags":["TALK"],"min":5,"students":"Screens down while you teach. Tab 4 holds the rule cards to look back at."},{"n":5,"id":"s5","name":"Punctuation contest","short":"Punct. contest","tags":["SCREEN"],"min":9,"students":"Screens up. Student Page, tab 5."},{"n":6,"id":"s6","name":"Punctuation fix-it","short":"Fix-it","tags":["PAPER","TALK"],"min":10,"students":"Screens down. Paper sheet, front, STEP 6."},{"n":7,"id":"s7","name":"Reading check","short":"Check","tags":["SCREEN"],"min":10,"students":"Screens up. Student Page, tab 7."},{"n":8,"id":"s8","name":"Writing lab","short":"Writing","tags":["PAPER","TALK"],"min":14,"students":"Screens down. Paper sheet, back, STEP 8."},{"n":9,"id":"s9","name":"Unit send-off","short":"Send-off","tags":["TALK"],"min":4,"students":"Screens down."},{"n":10,"id":"s10","name":"Next-book ballot","short":"Ballot","tags":["SCREEN"],"min":12,"students":"Screens up. Student Page, tab 10."},{"n":11,"id":"s11","name":"Wrap","short":"Wrap","tags":["TALK"],"min":3,"students":"Screens down. Paper sheets out."}],"vocab":[{"word":"culpable","pos":"adjective","pron":"KUL-puh-bul","ety":"Latin culpa, \"fault, blame.\" The same root hides inside culprit and mea culpa.","def":"Deserving blame for something that went wrong.","syn":"blameworthy, at fault, answerable","ant":"blameless, innocent, exonerated","textEx":"The question the trial in Chapter 11 exists to answer, and Daphne has already answered it about herself before anyone else speaks.","usageEx":"The report found the company culpable, though no one person had made the decision."},{"word":"remorse","pos":"noun","pron":"rih-MORSE","ety":"Latin remordere, \"to bite again\": re- (\"again\") + mordere (\"to bite\"). Remorse is the thing that bites you a second time, after the event is over.","def":"Deep, lasting regret for something you have done.","syn":"contrition, compunction, self-reproach","ant":"indifference, callousness, impenitence","textEx":"Daphne after the mutineers. The etymology is the whole description: the first bite was the act, and this is the second one.","usageEx":"He felt no remorse about the argument until he saw her face three days later."},{"word":"impartial","pos":"adjective","pron":"im-PAR-shul","ety":"Latin in- (\"not\") + partialis (\"of a part, biased toward one side\"). To be impartial is to belong to no part.","def":"Not favoring one side over another; judging without a stake in the outcome.","syn":"unbiased, disinterested, even-handed","ant":"partisan, prejudiced, partial","textEx":"A thing the Nation cannot actually supply in Chapter 11, because everyone in the room knows everyone else.","usageEx":"She recused herself to keep the review impartial, though no one had questioned her fairness."},{"word":"mitigate","pos":"verb","pron":"MIT-ih-gate","ety":"Latin mitigare, \"to soften\": mitis (\"mild\") + agere (\"to drive\"). To mitigate is to drive something toward mildness.","def":"To make something less severe: a punishment, a harm, or the seriousness of a charge.","syn":"lessen, temper, alleviate","ant":"aggravate, intensify, worsen","textEx":"The legal question underneath Daphne's trial: do the circumstances soften what she did?","usageEx":"Nothing could undo the error, but a quick apology did mitigate the damage."},{"word":"truce","pos":"noun","pron":"TROOSS","ety":"Old English trēow, \"faith, promise, good faith.\" The Middle English plural trewes meant \"pledges.\" Same root as true and trust. A truce began as a promise.","def":"An agreement to stop fighting for a set time.","syn":"ceasefire, armistice, lull","ant":"war, hostilities, fighting","textEx":"Chapter 13's title. The two sides talk about how the conflict will be settled before anyone fights.","usageEx":"The two teams called a truce so everyone could eat lunch."},{"word":"parley","pos":"noun / verb","pron":"PAR-lee","ety":"Old French parler, \"to speak,\" from Late Latin parabolare. The same family as parliament and parlor: places and acts of talking.","def":"A conversation between enemies to settle the terms of a conflict.","syn":"negotiation, talks, conference","ant":"standoff, silence, fighting","textEx":"Chapter 13. The two sides negotiate how the dispute will be settled. The parley is the talking; a truce is what it may produce.","usageEx":"The captains met for a parley under a white flag."},{"word":"stratagem","pos":"noun","pron":"STRAT-uh-jum","ety":"Greek stratēgēma, \"a general's trick,\" from stratēgos, \"general\": stratos (\"army\") + agein (\"to lead\"). Strategy is its sibling.","def":"A clever plan or trick for outwitting an opponent.","syn":"ploy, maneuver, ruse","ant":"brute force, directness","textEx":"Chapter 14. As you recall the duel, ask whether Mau wins by strength or by a plan, and which of those a stratagem would be.","usageEx":"Her stratagem was to let the other team believe they were winning."},{"word":"legitimate","pos":"adjective","pron":"luh-JIT-uh-mit","ety":"Latin legitimus, \"lawful,\" from lex, legis, \"law.\" Something legitimate is in line with the law, or accepted as if it were.","def":"Accepted as rightful or valid; having real authority.","syn":"lawful, rightful, valid","ant":"illegitimate, unfounded, bogus","textEx":"The question underneath Chapter 14: what makes someone's authority rightful when no written law exists?","usageEx":"A leader her own people never accepted is hard to call legitimate."},{"word":"exacerbate","pos":"verb","pron":"ig-ZASS-er-bate","ety":"Latin exacerbare, \"to irritate,\" from ex- (intensive) + acerbus, \"harsh, bitter.\" To exacerbate is to make something more bitter.","def":"To make a bad situation worse.","syn":"worsen, aggravate, intensify","ant":"mitigate, ease, soothe","textEx":"PSAT/SAT word. Chapter 13: ask what each side does that could exacerbate the conflict, and what each does to calm it. Its opposite is mitigate.","usageEx":"Arguing with the referee only exacerbated the team's problems."}],"wItems":[{"id":"W1","cat":"Meaning","rule":"culpable","stem":"Which person is <b>culpable</b>?","opts":["A referee who stays neutral between two teams.","A driver who ignored a red light and caused a crash.","A leader whose authority everyone accepts as rightful.","A person who feels deep, lasting regret about a mistake."],"ans":1,"why":["That describes <i>impartial</i>, someone who favors neither side. <i>Culpable</i> is about blame.",null,"That describes <i>legitimate</i>. Whether authority is rightful is a different question from who is to blame.","That is <i>remorse</i>, the feeling. Someone can feel remorse and still be culpable, but the words mean different things."],"explain":"<b>Culpable</b> comes from Latin <i>culpa</i>, \"fault, blame\" (the same root as <i>culprit</i>). A culpable person deserves blame for what went wrong. The driver who ignored the light caused the crash, so the driver is culpable."},{"id":"W2","cat":"Meaning","rule":"stratagem","stem":"A <b>stratagem</b> is...","opts":["a clever plan for outwitting an opponent.","an agreement to stop fighting for a set time.","a conversation between enemies to settle terms.","deep regret for something you did."],"ans":0,"why":[null,"That is a <i>truce</i>. A stratagem is a plan, not an agreement between sides.","That is a <i>parley</i>. A stratagem is something you plan alone, to win.","That is <i>remorse</i>, a feeling. A stratagem is a plan."],"explain":"<b>Stratagem</b> comes from Greek <i>stratēgēma</i>, \"a general's trick\" (<i>strategy</i> is its sibling). A stratagem is a clever plan for outwitting an opponent."},{"id":"W3","cat":"Meaning","rule":"impartial","stem":"A judge who is <b>impartial</b>...","opts":["feels sorry about an earlier ruling.","makes a bad situation worse.","treats both sides fairly and has no stake in who wins.","is accepted by everyone as having rightful authority."],"ans":2,"why":["That is <i>remorse</i>. Impartial is about fairness, not about regret.","That is <i>exacerbate</i>, a verb. Impartial is an adjective that describes how someone judges.",null,"That is <i>legitimate</i>. A judge can have rightful authority and still lean toward one side."],"explain":"<b>Impartial</b> comes from Latin <i>in-</i> (\"not\") + <i>partialis</i> (\"of a part, biased toward one side\"). To be impartial is to belong to no side. The judge treats both fairly."},{"id":"W4","cat":"In context","rule":"truce","stem":"After three days of fighting, the two crews finally agreed to a ______ so both could carry off their wounded.","opts":["stratagem","remorse","culpable","truce"],"ans":3,"why":["A stratagem is a clever plan to win. The sentence describes both sides agreeing to stop.","Remorse is a feeling of regret. You cannot \"agree to\" a feeling, and the crews agreed to something shared.","<i>Culpable</i> is an adjective meaning blameworthy. The sentence needs a noun after \"a\".",null],"explain":"A <b>truce</b> is an agreement to stop fighting for a set time. The clue is \"agreed to ... so both could carry off their wounded\": two sides stopping on purpose. (<i>Truce</i> began as a promise: same root as <i>true</i> and <i>trust</i>.)"},{"id":"W5","cat":"In context","rule":"legitimate","stem":"Nobody had voted and nobody had been asked, so many people refused to call his rule ______.","opts":["impartial","legitimate","culpable","truce"],"ans":1,"why":["<i>Impartial</i> describes fair judging. The sentence is about whether his authority was accepted as rightful.",null,"<i>Culpable</i> means to blame for something. It does not describe whether a rule is rightful.","A truce is a noun (an agreement). The sentence needs an adjective to describe \"rule\"."],"explain":"<b>Legitimate</b> means accepted as rightful, having real authority. The clue is \"nobody had voted and nobody had been asked\": the people had not accepted his rule as rightful. (From Latin <i>lex, legis</i>, \"law.\")"},{"id":"W6","cat":"In context","rule":"exacerbate","stem":"She meant to calm the quarrel, but her angry reply only served to ______ it.","opts":["exacerbate","mitigate","impartial","truce"],"ans":0,"why":[null,"<i>Mitigate</i> means to make less severe, the opposite of what an angry reply does. The word \"but\" signals her reply did the reverse of calming.","An adjective. The sentence needs a verb that acts on \"it\".","A noun. The sentence needs a verb that acts on \"it\"."],"explain":"<b>Exacerbate</b> means to make a bad situation worse. The clue is \"meant to calm ... but\": the reply made the quarrel worse. It is a verb, and so is the blank (\"served to ______ it\"). (From Latin <i>acerbus</i>, \"harsh, bitter.\")"},{"id":"W7","cat":"Root","rule":"remorse","stem":"<b>Remorse</b> comes from Latin <i>remordere</i>, \"to bite again.\" Which person shows <b>remorse</b>?","opts":["A girl who wins a game fairly and feels proud.","A coach who treats both teams exactly the same.","A boy who cannot stop thinking about the harsh thing he said to his friend.","A captain who invents a clever plan to win."],"ans":2,"why":["Pride is not a second bite of regret. Remorse is about regretting something you did.","That is being <i>impartial</i>, not feeling regret.",null,"That is a <i>stratagem</i>, a plan, not a feeling."],"explain":"<b>Remorse</b> is deep, lasting regret. The Latin gives the picture: the first bite was the act (the harsh words), and the second bite is the regret that keeps coming back."},{"id":"W8","cat":"Root","rule":"parley","stem":"<b>Parley</b> comes from the French <i>parler</i>, \"to speak.\" Which is a <b>parley</b>?","opts":["Two teams agree to stop playing so everyone can eat lunch.","A general quietly plans a trick to outwit the other side.","A judge decides who deserves the blame.","Two enemy captains meet under a white flag to talk over terms."],"ans":3,"why":["That is a <i>truce</i>, the agreement a parley may produce. The parley is the talking itself.","That is a <i>stratagem</i>. A parley is spoken, and it happens between the sides.","That is a ruling about someone <i>culpable</i>. A parley is a conversation between opponents.",null],"explain":"A <b>parley</b> is a conversation between enemies to settle the terms of a conflict. The root, <i>parler</i>, \"to speak,\" is the whole clue: the talking is the parley, and a truce is what it may produce."},{"id":"W9","cat":"Opposite","rule":"mitigate","stem":"Which word is the closest OPPOSITE of <b>exacerbate</b>?","opts":["legitimate","mitigate","culpable","impartial"],"ans":1,"why":["<i>Legitimate</i> is about rightful authority. It has nothing to do with making a problem worse or better.",null,"<i>Culpable</i> is about blame. It is not a verb of making things better or worse.","<i>Impartial</i> is about fairness. It is an adjective, and exacerbate is a verb."],"explain":"<b>Mitigate</b> means to make something less severe (from Latin <i>mitigare</i>, \"to soften\"). <b>Exacerbate</b> means to make something worse. They are opposites: one softens a problem and the other sharpens it."}],"wRounds":[{"name":"Round 1 · Meanings","ids":["W1","W2","W3"]},{"name":"Round 2 · In context","ids":["W4","W5","W6"]},{"name":"Round 3 · Roots and opposites","ids":["W7","W8","W9"]}],"pItems":[{"id":"P1","cat":"Lists","rule":"C1","stem":"Which sentence is punctuated correctly?","opts":["Mau carried rope a knife, and a coconut shell.","Mau carried rope, a knife, and a coconut shell.","Mau, carried rope, a knife, and a coconut shell.","Mau carried, rope, a knife, and a coconut shell."],"ans":1,"why":["There is no comma between 'rope' and 'a knife'. In a list, every item except the last needs a comma after it (Rule C1).",null,"The first comma separates the subject 'Mau' from its verb 'carried'. Never put a comma between a subject and its verb.","This comma splits the verb 'carried' from the first thing carried. Commas go between list items, not between the verb and the list."],"explain":"<b>Rule C1.</b> A list of three or more things needs a comma after each item except the last: rope, a knife, and a coconut shell. The commas only separate the items; none of them separates 'Mau' from 'carried'."},{"id":"P2","cat":"Openers","rule":"C2","stem":"Which sentence is punctuated correctly?","opts":["After the wave, swept the village away Mau stood alone on the beach.","After the wave swept the village away Mau stood alone, on the beach.","After the wave swept the village away. Mau stood alone on the beach.","After the wave swept the village away, Mau stood alone on the beach."],"ans":3,"why":["The comma interrupts the opener in the middle, and nothing marks where the opener actually ends (after 'away').","The comma is in the wrong place. It belongs after the opener, not before 'on the beach'.","The period leaves 'After the wave swept the village away' as a fragment. It starts with 'After', so it waits for a main sentence to finish it.",null],"explain":"<b>Rule C2.</b> 'After the wave swept the village away' is an opener: it sets the scene but cannot stand alone. The main sentence starts at 'Mau stood'. Put the comma exactly where the opener ends."},{"id":"P3","cat":"Openers","rule":"C2","stem":"Which sentence is punctuated correctly?","opts":["As soon as the storm passed, the survivors began to count their losses.","As soon as the storm passed the survivors, began to count their losses.","As soon as, the storm passed the survivors began to count their losses.","As soon as the storm passed the survivors began to count their losses."],"ans":0,"why":[null,"The comma is one word too late. It splits the subject 'the survivors' from the verb 'began'. The opener ends at 'passed'.","This comma cuts the opener in half after 'As soon as'. The opener is the whole group 'As soon as the storm passed'.","No comma at all. Without it the reader has to guess where the opener ends and may read 'passed the survivors' together."],"explain":"<b>Rule C2.</b> The opener is 'As soon as the storm passed'. The main sentence starts at 'the survivors began'. The comma goes between them, right after 'passed'."},{"id":"P4","cat":"Joining","rule":"C3","stem":"Which sentence is punctuated correctly?","opts":["Daphne did not speak Mau's language but, she understood his drawings in the sand.","Daphne did not speak Mau's language but she understood his drawings in the sand.","Daphne did not speak Mau's language, but she understood his drawings in the sand.","Daphne did not speak Mau's language, she understood his drawings in the sand."],"ans":2,"why":["The comma sits after 'but'. It belongs before 'but', where the first sentence ends.","Both halves are complete sentences, so 'but' needs a comma in front of it to mark the join.",null,"A comma splice: two complete sentences joined by only a comma. It needs a joining word such as 'but' after the comma."],"explain":"<b>Rule C3.</b> 'Daphne did not speak Mau's language' and 'she understood his drawings in the sand' are both complete sentences. When but, and, so, or yet joins two complete sentences, the comma goes before the joining word."},{"id":"P5","cat":"Joining","rule":"C3","stem":"Which sentence is punctuated correctly?","opts":["Mau gathered the driftwood, and built a fire on the beach.","Mau gathered the driftwood and, built a fire on the beach.","Mau gathered the driftwood. And built a fire on the beach.","Mau gathered the driftwood and built a fire on the beach."],"ans":3,"why":["What follows 'and' ('built a fire on the beach') has no subject of its own, so it is not a complete sentence. No comma is needed.","A comma right after 'and' never belongs here. It separates the joining word from the words it joins.","'And built a fire on the beach' is a fragment: no subject. It must stay attached to the sentence that gives it one (Mau).",null],"explain":"<b>Rule C3 has a trap.</b> The comma goes before a joining word only when what comes after it could stand alone as a sentence. 'Built a fire on the beach' cannot (who built it?), so there is no comma. Mau is the subject for both actions."},{"id":"P6","cat":"Joining","rule":"S2","stem":"Which sentence is punctuated correctly?","opts":["The tide was rising they dragged the canoe higher.","The tide was rising, so they dragged the canoe higher.","The tide was rising, they dragged the canoe higher.","The tide was rising, so, they dragged the canoe higher."],"ans":1,"why":["A run-on: two complete sentences stuck together with nothing between them.",null,"A comma splice: a comma alone is too weak to join two complete sentences.","The joining word 'so' already does the joining. The comma after 'so' interrupts the sentence for no reason."],"explain":"<b>Rule S2.</b> 'The tide was rising' and 'they dragged the canoe higher' are each a complete sentence. A comma plus a joining word (here, so) is one of the three correct ways to join them. The other two ways are a period or a semicolon."},{"id":"P7","cat":"Sentences","rule":"S1","stem":"Which of these is a complete sentence?","opts":["Running along the beach with the parrot.","Because Daphne could not explain the stars.","The parrot, which squawked nonsense all morning.","Mau pulled the canoe onto the sand."],"ans":3,"why":["No subject and no main verb. 'Running' only describes. Who ran, and what happened?","'Because' makes this group of words depend on something more. It leaves the reader waiting for the main idea.","It has a subject (the parrot), but 'which squawked nonsense all morning' only describes the parrot. There is no main verb saying what the parrot did.",null],"explain":"<b>Rule S1.</b> A complete sentence needs a subject (who or what), a main verb (what they did) and a finished thought. 'Mau' is the subject, 'pulled' is the main verb, and the thought is finished."},{"id":"P8","cat":"Run-ons","rule":"S2","stem":"Which sentence is punctuated correctly?","opts":["The wave came without warning the village had no time to run.","The wave came without warning, the village had no time to run.","The wave came without warning; the village had no time to run.","The wave came without warning; and the village had no time to run."],"ans":2,"why":["A run-on: two complete sentences with nothing between them.","A comma splice. A comma alone cannot join two complete sentences.",null,"A semicolon already does the joining. Adding 'and' after it doubles up. Use a semicolon alone, or a comma plus 'and'."],"explain":"<b>Rule S2.</b> The semicolon is the third way to join two closely related complete sentences. It works like a period that keeps the ideas close together, and it is used without a joining word."},{"id":"P9","cat":"Combined","rule":"C2 + C3","stem":"Which sentence is punctuated correctly?","opts":["When the Raiders arrived, Daphne stepped forward to speak, and the survivors fell silent.","When the Raiders arrived Daphne stepped forward to speak, and the survivors fell silent.","When the Raiders arrived, Daphne stepped forward to speak, the survivors fell silent.","When the Raiders arrived, Daphne stepped forward to speak and, the survivors fell silent."],"ans":0,"why":[null,"The comma after the opener 'When the Raiders arrived' is missing (Rule C2). The comma before 'and' is right.","A comma splice in the second half: 'Daphne stepped forward to speak' and 'the survivors fell silent' are two complete sentences, so the comma needs a joining word such as 'and'.","The comma sits after 'and' instead of before it. The comma that joins two sentences goes before the joining word."],"explain":"<b>Rules C2 and C3 together.</b> One comma ends the opener ('When the Raiders arrived,'). A second comma comes before 'and' because both halves after the opener are complete sentences."}],"pRounds":[{"name":"Round 1 · Lists and openers","ids":["P1","P2","P3"]},{"name":"Round 2 · Joining sentences","ids":["P4","P5","P6"]},{"name":"Round 3 · Broken sentences","ids":["P7","P8","P9"]}],"rules":[{"id":"C1","name":"Commas in a list","group":"Commas","say":"In a list of three or more things, put a comma after each item except the last. 'And' goes before the last item.","right":"Mau gathered rope, fruit, and fresh water.","wrong":"Mau gathered rope fruit and fresh water."},{"id":"C2","name":"Comma after an opener","group":"Commas","say":"If a sentence starts with a word or group of words that sets the scene before the main sentence begins (an opener), put a comma where the opener ends. Find the subject of the main sentence: the comma goes just before it.","right":"When the canoe arrived, Mau ran to the shore.","wrong":"When the canoe arrived Mau ran to the shore."},{"id":"C3","name":"Comma before a joining word","group":"Commas","say":"When one of the joining words (for, and, nor, but, or, yet, so) connects two complete sentences, put a comma before it. If what comes after the joining word is not a complete sentence, no comma.","right":"Mau was tired, but he kept walking.   |   No comma needed: Mau was tired but kept walking.","wrong":"Mau was tired but he kept walking."},{"id":"S1","name":"A complete sentence","group":"Sentences","say":"A complete sentence needs three things: a subject (who or what), a main verb (what they do or are), and a finished thought. Missing one of them is a fragment.","right":"Because the tide was rising, they moved the canoe.","wrong":"Because the tide was rising."},{"id":"S2","name":"Run-ons and comma splices","group":"Sentences","say":"Two complete sentences cannot be stuck together with nothing (a run-on) or with only a comma (a comma splice). There are three correct fixes: (1) a period, (2) a comma plus a joining word, or (3) a semicolon by itself.","right":"The tide was rising. They moved the canoe.   |   The tide was rising, so they moved the canoe.   |   The tide was rising; they moved the canoe.","wrong":"The tide was rising, they moved the canoe."}],"terms":[{"id":"sentence","name":"Complete sentence","say":"A group of words with a subject, a main verb and a finished thought. It can stand alone.","ex":"Mau pulled the canoe onto the sand."},{"id":"subject","name":"Subject","say":"The who or what the sentence is about.","ex":"<b>Mau</b> pulled the canoe. (Who pulled it? Mau.)"},{"id":"verb","name":"Main verb","say":"The word that says what the subject does or is.","ex":"Mau <b>pulled</b> the canoe."},{"id":"fragment","name":"Fragment","say":"A piece of a sentence that is missing a subject, a main verb or a finished thought.","ex":"<b>Wrong:</b> Because the tide was rising.<br><b>Fixed:</b> Because the tide was rising, they moved the canoe."},{"id":"opener","name":"Opener (introductory element)","say":"A word or group of words at the start of a sentence that sets the scene but cannot stand alone. It gets a comma after it.","ex":"<b>When the canoe arrived</b>, Mau ran to the shore."},{"id":"runon","name":"Run-on (fused sentence)","say":"Two complete sentences jammed together with nothing between them.","ex":"<b>Wrong:</b> Mau was tired he kept walking.<br><b>Fixed:</b> Mau was tired, but he kept walking."},{"id":"splice","name":"Comma splice","say":"Two complete sentences joined by only a comma. A comma is too weak to hold two sentences together.","ex":"<b>Wrong:</b> Mau was tired, he kept walking.<br><b>Fixed:</b> Mau was tired; he kept walking."},{"id":"joining","name":"Joining word (coordinating conjunction)","say":"One of seven small words: for, and, nor, but, or, yet, so. A comma plus one of them can join two complete sentences.","ex":"Mau was tired<b>, but</b> he kept walking."},{"id":"semicolon","name":"Semicolon","say":"Joins two closely related complete sentences with no joining word. It is like a period that keeps the ideas together. Do not put it in front of a joining word like so or but; use a comma there.","ex":"Mau was tired; he kept walking."},{"id":"concession","name":"Concession","say":"Admit a fair point from the other side, then explain why your claim still stands. A real concession grants something true; it does not insult the other side.","ex":"<i>Admittedly</i>, the duel was dangerous, but it still spared more lives than a battle would have."},{"id":"claim","name":"Claim, Evidence, Reasoning","say":"Claim: your answer. Evidence: one specific proof from the text. Reasoning: an explanation of how the evidence proves the claim.","ex":"Claim: Mau leads by risking himself. Evidence: he faces Cox in the duel. Reasoning: by risking his life he spares both groups a larger battle."}],"diag":{"title":"The Chart You Cannot Carry","passage":["In the Marshall Islands, navigators once taught their apprentices with a tool that looks, to a stranger, like a craft project: a lattice of palm-rib sticks tied together with fiber, with small shells fastened at certain points. The shells mark islands. The sticks, some straight and some curved, show something that cannot be seen from a ship's deck at all: the way ocean swells bend and collide as they pass around land.","These charts were not carried on voyages. A student studied one on shore until the pattern was in his body, and then he read the same pattern in the motion of the boat beneath him, sometimes lying down in the hull to feel it. The chart was a lesson, not a map to unroll.","Outsiders who first saw the charts often misjudged them. A chart did not look like a map, so it was filed away as a curiosity or an ornament. The mistake was not a lack of intelligence. It was a lack of fit: the visitors expected knowledge to arrive in a familiar form, with fixed north, measured distances, and printed labels. A system that stored its accuracy in another form simply failed to register.","Later researchers who took the time to learn how the charts worked reached a different conclusion. The patterns they encoded were real, and the method that taught them was a careful one. Still, it would be too simple to say the old judgment was entirely foolish. A chart that exists only in one trained person's memory is harder to check, share, and correct than a printed one, and navigators often guarded who was taught. Knowledge can be sound and still be fragile. The lesson is not that every unfamiliar system is secretly brilliant. It is that a system should be tested on what it claims to do, not on how closely it resembles our own."],"mc":[{"id":"D1","cat":"Main Idea / Central Claim","stem":"Which statement best expresses the central claim of the passage?","opts":["Marshallese navigators kept their knowledge secret because outsiders could not be trusted.","Stick charts were more accurate than printed maps, so printed maps should be abandoned.","A system of knowledge should be tested on what it claims to do, not on whether it looks like our own.","Researchers who studied the charts proved that earlier visitors had been foolish."],"ans":2,"why":["The passage says navigators often guarded who was taught, but that is a detail, not the central claim, and it never says outsiders could not be trusted.","Extreme and unsupported. The passage never compares accuracy with printed maps.",null,"Contradicted: the passage says the mistake \"was not a lack of intelligence.\""],"explain":"The last two sentences state the claim. Wrong choices either blow a detail up into the main idea (choice 1) or use extreme language (choices 2 and 4)."},{"id":"D2","cat":"Inference","stem":"Based on the passage, why were the charts typically not carried on voyages?","opts":["Their purpose was to teach a pattern that the navigator would then sense in the sea itself.","They were too fragile to survive a journey by canoe.","The navigators did not trust the charts to be accurate.","Outsiders had forbidden the navigators from taking them."],"ans":0,"why":[null,"Nothing in the passage says the charts were fragile. An inference must rest on the text.","The passage says the patterns were real and the method careful. It does not suggest distrust.","The outsiders appear only as people who misjudged the charts. Nothing suggests they controlled the voyages."],"explain":"Paragraph 2 gives the clue: \"a lesson, not a map to unroll\" and the pattern was learned \"on shore until the pattern was in his body.\""},{"id":"D3","cat":"Vocabulary in Context","stem":"In paragraph 3, \"simply failed to register\" most nearly means:","opts":["was never written down","was never noticed as meaningful","was sold for a low price","was not formally enrolled"],"ans":1,"why":["The passage is about whether visitors recognized the knowledge, not about writing.",null,"Nothing is bought or sold in the sentence.","This is the \"signing up\" meaning of register. It does not fit a system of knowledge."],"explain":"Predict first: the visitors looked at the charts and did not see knowledge. \"Register\" here means to make an impression, to be noticed."},{"id":"D4","cat":"Evidence-Based Support","stem":"Which line from the passage best supports the idea that the visitors' mistake came from expectation, not from a lack of intelligence?","opts":["\"A student studied one on shore until the pattern was in his body.\"","\"The shells mark islands.\"","\"Later researchers who took the time to learn how the charts worked reached a different conclusion.\"","\"...the visitors expected knowledge to arrive in a familiar form, with fixed north, measured distances, and printed labels.\""],"ans":3,"why":["That describes how navigators learned. It says nothing about what the visitors expected.","A fact about the chart, with no link to the visitors' mistake.","That shows later researchers judged differently, but it does not say why the first visitors erred.",null],"explain":"Match the claim to the line that gives the <b>cause</b>: expectation. Only the last line says what the visitors expected."},{"id":"D5","cat":"Tone, Rhetoric & Structure","stem":"In the final paragraph, the author does which of the following?","opts":["Abandons the passage's main point to introduce a new topic.","Admits a fair limitation of the charts, then restates the larger point.","Attacks the researchers who studied the charts.","Lists other navigation tools used in the Pacific."],"ans":1,"why":["The final sentence returns to the main point.",null,"The researchers are described as taking the time to learn how the charts worked, which is a favorable portrayal.","No other tools appear anywhere in the paragraph."],"explain":"\"Still, it would be too simple...\" is a <b>concession</b>: the author grants a fair weakness (the charts are hard to check), then holds the claim."}]},"ballot":{"books":[{"n":1,"title":"Dry","author":"Neal and Jarrod Shusterman","genre":"Survival dystopia","length":"Longer","synopsis":"Alyssa Morrow's California suburb is running out of water. When the taps go dry, her neighbors turn from friendly to desperate within days. Alyssa, her younger brother, and a neighbor boy set out to find water, and along the way they meet others doing the same. The story asks what happens to a community when there is not enough for everyone, and which choices people can live with afterward.","through":"What do ordinary people owe their neighbors when resources run out?","heads":"Moderate violence and peril."},{"n":2,"title":"Do Androids Dream of Electric Sheep?","author":"Philip K. Dick","genre":"Dystopian science fiction","length":"Short","synopsis":"After a nuclear war, most of humanity has left Earth, and real animals have become precious status symbols. Rick Deckard, a bounty hunter in San Francisco, owns an electric sheep and dreams of a real one. To earn it, he must track down six escaped androids that look exactly like people. His main tool is a test that measures empathy, and the more he uses it, the less sure he becomes about what it proves.","through":"What makes someone a person, and who gets to decide?","heads":"Mature themes, including one sexual scene. Reads faster than it looks."},{"n":3,"title":"The Hitchhiker's Guide to the Galaxy","author":"Douglas Adams","genre":"Comic science fiction","length":"Short","synopsis":"On an ordinary Thursday, Arthur Dent is trying to stop a bulldozer from flattening his house. Then his friend Ford Prefect explains that he is really an alien, and that Earth is about to be demolished to make room for a space highway. The two hitch a ride off the planet and into a galaxy where bureaucracy is lethal, poetry is a weapon, and a handy electronic book called the Guide has the words DON'T PANIC on its cover. It is a fast, silly adventure with a sharp view of how people behave.","through":"How should people live when the universe does not seem to care?","heads":"Dry British humor, mild language."},{"n":4,"title":"Something Wicked This Way Comes","author":"Ray Bradbury","genre":"Horror / dark fantasy","length":"Medium","synopsis":"Will Halloway and Jim Nightshade are thirteen and best friends, born two minutes apart: Will just before midnight on October 30, Jim just after. One October night a carnival arrives in their Illinois town at three in the morning, with a carousel that seems to promise things people want most. The boys sneak out to watch it and realize the carnival is not what it seems. Only Will's father, a quiet man who feels old, may understand what the carnival wants.","through":"Why do people trade away what they have for what they think they want?","heads":"Scary atmosphere and peril. Dense, poetic language."},{"n":5,"title":"A Monster Calls","author":"Patrick Ness","genre":"Illustrated dark fantasy","length":"Short","synopsis":"Thirteen-year-old Conor has the same nightmare every night, and his mother is seriously ill. At seven minutes past midnight a monster the size of a tree walks up to his window. It is not the monster from the nightmare, and it says it has come to tell him three stories. When the stories are done, Conor must tell it a fourth: the truth he has been hiding. The book is illustrated with dark, moody drawings throughout.","through":"How do we face a truth we are afraid to say out loud?","heads":"A parent's serious illness; emotionally heavy."},{"n":6,"title":"It's Trevor Noah: Born a Crime (Young Readers)","author":"Trevor Noah","genre":"Contemporary memoir","length":"Medium","synopsis":"Trevor Noah was born in South Africa at a time when the law made his very existence a crime, because his mother was Black and his father was white. This young readers edition follows him from a childhood spent hidden indoors to a teenager who learns to talk his way into any group. His fearless, funny mother raises him with fierce faith and a stubborn refusal to be limited. The stories are funny, but they are also a clear-eyed look at how a society can sort people by rules they did not choose.","through":"How do identity and belonging change when a society sorts people by rules they did not choose?","heads":"Racism and some family violence, adapted for young readers."},{"n":7,"title":"I Must Betray You","author":"Ruta Sepetys","genre":"Historical thriller","length":"Medium","synopsis":"In 1989 Romania, seventeen-year-old Cristian Florescu is growing up in Bucharest under a dictator, in a country where neighbors, teachers and even friends might be informing on one another. Then the secret police come to him and demand that he spy on the people close to him. He has to decide how much of himself he can give away while keeping the people he loves safe. The country around him is close to breaking, and Cristian can feel it.","through":"What do you owe your family, your country and yourself when all three pull in different directions?","heads":"Political violence and intense scenes."},{"n":8,"title":"Code Talker","author":"Joseph Bruchac","genre":"Historical novel","length":"Medium","synopsis":"Ned Begay is a Navajo boy sent to a government boarding school where he is punished for speaking his own language. Years later, as a young man, he joins the Marines and is chosen for a secret mission in the Pacific. The military needs a code the enemy cannot break, and the answer is the language Ned was once punished for speaking. The story is told by Ned as an older man, looking back on both the war and the school.","through":"Can a culture that was suppressed become the thing that protects the people who suppressed it?","heads":"World War II combat violence."},{"n":9,"title":"The Invisible Man","author":"H. G. Wells","genre":"Classic science fiction / horror","length":"Short","synopsis":"One wintry day in February, a stranger arrives through the snow at an inn in the English village of Iping. His head is wrapped in bandages, his eyes are hidden behind dark glasses, and he demands to be left completely alone. The villagers are curious, and then suspicious, as odd things begin to happen around him. As the secret behind his appearance comes out, the question becomes what a person will do when no one can see him. This is a classic from 1897, so the language is older and denser than most modern books.","through":"What happens to a person's conscience when no one can see what they do?","heads":"Older language; some violence."},{"n":0,"title":"12 Angry Men","author":"Reginald Rose","genre":"Courtroom drama (play)","length":"Very short","synopsis":"A boy is on trial for murder, and twelve jurors file into a sweltering room to decide his fate. Almost everyone is ready to vote guilty and get home. One juror is not ready; he does not say the boy is innocent, only that the matter deserves more than a minute of talk. Over the next hours, the jurors argue, lose their tempers, and have to look at their own assumptions. It is a play, so it reads like a script, and it is short.","through":"What does it take for one person to question a whole group?","heads":"Dated setting; characters voice prejudice, and the play shows why it is wrong."}]}};

function cScore(items, picks) {
  var sc = D.scoring, streak = 0, per = [0, 0, 0], tot = 0, pts = [];
  for (var i = 0; i < items.length; i++) {
    if (picks[i] == null) break;
    var ok = picks[i] === items[i].ans, p = 0;
    if (ok) { streak++; p = sc.correct + (streak >= sc.streakAt ? sc.streakBonus : 0); } else streak = 0;
    pts.push({ p: p, ok: ok, streak: streak }); per[Math.floor(i / 3)] += p; tot += p;
  }
  return { pts: pts, per: per, tot: tot };
}
function cPicks(k) { var C = CONTEST[k], st = S[k]; return C.items.map(function (it) { return st.chk[it.id] ? st.ans[it.id] : null; }); }
function roundDone(k, ri) { var C = CONTEST[k]; return C.rounds[ri].ids.every(function (id) { return S[k].seen[id]; }); }
function contestDone(k) { return roundDone(k, 2); }
function done(id) {
  if (id === 's3') return contestDone('W');
  if (id === 's5') return contestDone('P');
  if (id === 's7') return !!S.diagDone;
  if (id === 's10') return !!S.ballotDone;
  return false;
}

/* ---------- shared pieces ---------- */
function banner(st) {
  var scr = isScreen(st);
  return '<div class="banner ' + (scr ? 'scr' : 'off') + '"><span class="n">STEP ' + st.n + '</span><b>' + esc(st.name) + '</b><span class="tags">' + st.tags.join(' + ') + '</span></div>' +
    (scr ? '' : '<div class="down"><b>SCREEN DOWN.</b> ' + esc(st.students.replace(/^Screens? down\.?\s*/i, '')) + '</div>');
}
function optBtn(it, i, state, act, id, sel, ck) {
  var cls = 'opt', why = '';
  if (ck) { if (i === it.ans) cls += ' right'; else if (i === sel) cls += ' wrong'; if (i !== it.ans && it.why[i]) why = '<span class="why">' + it.why[i] + '</span>'; }
  return '<button class="' + cls + '" data-a="' + act + '" data-id="' + id + '" data-i="' + i + '" aria-pressed="' + (sel === i) + '"' + (ck ? ' disabled' : '') + '><span class="n">' + (i + 1) + '</span><span class="t">' + it.opts[i] + '</span>' + why + '</button>';
}
function copyBtn(t) { return '<button class="btn" data-a="copy" data-t="' + esc(t) + '">Copy code</button>'; }
function codeBox(code, label, note) {
  return '<div class="card"><h3>' + label + '</h3><p class="lede">' + note + '</p><div class="code" id="codeout">' + esc(code) + '</div><div class="row">' + copyBtn(code) + '<span id="copied" class="lede"></span></div></div>';
}
function lockCard(tab, title, body) {
  return '<div class="card lock"><h2>' + title + '</h2><p class="lede">' + body + '</p><label for="codein" class="lede">Code from your tutor</label><input id="codein" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="lerr"><div class="row"><button class="btn primary" data-a="unlock" data-tab="' + tab + '">Unlock</button></div><div class="err" id="lerr" role="alert">' + esc(lockErr) + '</div></div>';
}
function termCard(t) { return '<div class="term"><h4>' + t.name + '</h4><p>' + t.say + '</p><div class="ex">' + t.ex + '</div></div>'; }
function termsFor(ids) { return ids.map(function (i) { return D.terms.filter(function (t) { return t.id === i; })[0]; }).filter(Boolean).map(termCard).join(''); }
function ruleCard(r) {
  var rights = String(r.right).split('   |   ').map(function (x) { return '<div class="r"><span class="lab">Right</span>' + esc(x) + '</div>'; }).join('');
  return '<div class="rule"><h4><span class="id">' + r.id + '</span>' + esc(r.name) + '</h4><p>' + esc(r.say) + '</p><div class="pair"><div class="w"><span class="lab">Wrong</span>' + esc(r.wrong) + '</div>' + rights + '</div></div>';
}
function rulesBlock() { return D.rules.map(ruleCard).join(''); }

/* ---------- step panels ---------- */
function vS1() { var st = STEP.s1; return banner(st) + '<div class="card"><h3>What happens</h3><p>Your tutor asks two questions about Chapter 15 out loud. There is nothing to type or write.</p></div>'; }
function vS2() {
  var st = STEP.s2;
  return banner(st) + '<div class="card"><h3>What happens</h3><p>Two big ideas from Chapter 15. For each one: <b>say</b> what happened (from memory), <b>think</b> about the idea out loud, then <b>write privately</b> in the box for that moment on the front of your paper sheet. Nobody has to share what they wrote.</p><p class="lede">We also reread one short stretch of Chapter 15 together. Have your book ready for that part only.</p></div>';
}
function vS4() {
  var st = STEP.s4;
  return banner(st) + '<div class="card"><h3>Five punctuation rules</h3><p class="lede">Listen while your tutor teaches each one. Come back here whenever you need a reminder, during the contest or the fix-it. Each rule has a name, a plain-words rule and a Wrong and Right example.</p></div>' +
    '<div class="card"><h3>Commas</h3>' + D.rules.filter(function (r) { return r.group === 'Commas'; }).map(ruleCard).join('') + '<h3>Complete sentences</h3>' + D.rules.filter(function (r) { return r.group === 'Sentences'; }).map(ruleCard).join('') + '</div>' +
    '<div class="card"><h3>Terms in plain words</h3>' + termsFor(['sentence', 'subject', 'verb', 'fragment', 'opener', 'joining', 'splice', 'runon', 'semicolon']) + '</div>';
}
function vS6() {
  var st = STEP.s6;
  return banner(st) + '<div class="card"><h3>What happens</h3><p>Five sentences on the front of your paper sheet each have one punctuation mistake. Write the corrected sentence under each one. Then check your own work while your tutor shows each answer and explains why.</p><details class="tm"><summary>Need the rules?</summary>' + rulesBlock() + '</details></div>';
}
function vS8() {
  var st = STEP.s8;
  return banner(st) + '<div class="card"><h3>What happens</h3><p>You will study a model paragraph on the back of your paper sheet, label its parts, and then write your own paragraph. Everything you need is on the sheet.</p></div><div class="card"><h3>The four parts, in plain words</h3>' + termsFor(['claim', 'concession']) + '</div>';
}
function vS9() { var st = STEP.s9; return banner(st) + '<div class="card"><h3>What happens</h3><p>One question for the whole group, out loud. Nothing to type.</p></div>'; }
function vS11() {
  var st = STEP.s11;
  return banner(st) + '<div class="card"><h3>Homework</h3><p>Get a paper copy of the winning book and read the first two chapters. Use your Reading Log page while you read. Your tutor will check it at the start of our next lesson.</p><p class="lede">Keep your paper sheet. Your tutor will take a photo of the back of it.</p></div>';
}

/* ---------- contests (steps 3 and 5) ---------- */
function vContest(k) {
  var C = CONTEST[k], st = S[k], stp = STEP[C.step];
  if (!S.unlocked[C.step]) return banner(stp) + lockCard(C.step, C.title, k === 'W' ? 'Study nine word cards, then play three rounds against the other student. Your tutor will say the code when it is time.' : 'Three rounds against the other student: pick the sentence that is punctuated correctly. Your tutor will say the code when it is time.');
  var h = banner(stp);
  var sc = D.scoring;
  h += '<div class="card"><h3>How the contest works</h3><p>Three rounds, three questions each. You earn <b>' + sc.correct + ' points</b> for each correct answer, <b>+' + sc.streakBonus + ' bonus</b> for every answer that is part of a streak of ' + sc.streakAt + ' correct in a row, and the tutor adds <b>+' + sc.roundWin + '</b> for winning a round. After each answer you see why it is right or wrong.</p>' + (k === 'P' ? '<p class="lede">The practice sentences are made up in the world of Nation. They are not summaries of the book.</p>' : '') + '</div>';
  if (k === 'W') {
    h += '<div class="card"><h3>Word cards</h3><p class="lede">All nine words come from Chapters 11 to 14. Read the card first; every question is about one of these.</p>';
    D.vocab.forEach(function (w) {
      h += '<details class="tm"' + (st.go === 0 ? ' open' : '') + '><summary>' + esc(w.word) + ' <span class="lede">(' + esc(w.pos) + ')</span></summary><div class="wc"><h4>' + esc(w.word) + '</h4><div class="p">' + esc(w.pos) + ' · say it: ' + esc(w.pron) + '</div><p><b>Means:</b> ' + esc(w.def) + '</p><p><b>Root:</b> ' + esc(w.ety) + '</p><p><b>Similar:</b> ' + esc(w.syn) + ' · <b>Opposite:</b> ' + esc(w.ant) + '</p><p><b>In the book:</b> ' + esc(w.textEx) + '</p><p><b>Example:</b> ' + esc(w.usageEx) + '</p></div></details>';
    });
    h += '</div>';
  } else {
    h += '<div class="card"><details class="tm"><summary>Rule cards (C1 to S2)</summary>' + rulesBlock() + '</details></div>';
  }
  if (st.go === 0) { return h + '<div class="card"><h3>Ready?</h3><p>Wait for your tutor to say <b>GO</b>, then start Round 1.</p><div class="row"><button class="btn primary" data-a="cgo" data-k="' + k + '">Start Round 1</button></div></div>'; }
  var ri = Math.min(st.go, 3) - 1, round = C.rounds[ri];
  var cur = round.ids.filter(function (id) { return !st.seen[id]; })[0];
  var sc2 = cScore(C.items, cPicks(k));
  h += '<div class="card"><div class="row"><span class="pts">Points: ' + sc2.tot + '</span><span class="lede">' + esc(round.name) + '</span></div></div>';
  if (cur) {
    var it = C.items.filter(function (x) { return x.id === cur; })[0], ix = C.items.indexOf(it), ck = !!st.chk[cur], sel = st.ans[cur];
    h += '<div class="card"><div class="cat">' + esc(round.name) + ' · question ' + (round.ids.indexOf(cur) + 1) + ' of 3' + (it.rule && k === 'P' ? ' · rule ' + esc(it.rule) : '') + '</div><div class="stem">' + it.stem + '</div><div class="opts">';
    it.opts.forEach(function (o, i) { h += optBtn(it, i, k, 'cpick', cur + '|' + k, sel, ck); });
    h += '</div>';
    if (!ck) h += '<div class="row"><button class="btn primary" data-a="ccheck" data-k="' + k + '" data-id="' + cur + '"' + (sel == null ? ' disabled' : '') + '>Check</button></div>';
    else {
      var ok = sel === it.ans, pt = sc2.pts[ix];
      h += '<p class="pts">' + (ok ? 'Correct: +' + pt.p + ' points' + (pt.streak >= D.scoring.streakAt ? ' (streak bonus!)' : '') : 'Not this time: 0 points') + '</p>';
      h += '<div class="explain' + (ok ? '' : ' warn') + '"><b class="h">' + (ok ? 'Right. Here is why' : 'Here is why the answer is different') + '</b>' + it.explain + '</div>';
      h += '<div class="row"><button class="btn primary" data-a="cnext" data-k="' + k + '" data-id="' + cur + '">' + (round.ids.indexOf(cur) === 2 ? 'Finish round ' + (ri + 1) : 'Next question') + '</button></div>';
    }
    return h + '</div>';
  }
  // round finished
  var digits = []; for (var r = 0; r <= ri; r++) C.rounds[r].ids.forEach(function (id) { digits.push(st.ans[id] + 1); });
  var code = S.who + '-' + k + '-' + digits.join('');
  h += '<div class="card"><h3>' + esc(round.name) + ' complete</h3><p class="score">Round points: ' + sc2.per[ri] + '</p></div>';
  h += codeBox(code, 'Your code so far', 'Read this to your tutor. It puts your answers on the big screen. Then wait for the next GO.');
  if (ri < 2) h += '<div class="card"><p>Wait for your tutor to say <b>GO</b>.</p><div class="row"><button class="btn primary" data-a="cgo" data-k="' + k + '">Start Round ' + (ri + 2) + '</button></div></div>';
  else {
    h += '<div class="card"><h3>Final points: ' + sc2.tot + '</h3><p class="lede">Round 1: ' + sc2.per[0] + ' · Round 2: ' + sc2.per[1] + ' · Round 3: ' + sc2.per[2] + '. Your tutor adds the round-win bonus on the big screen.</p></div>';
    h += '<div class="card"><h3>Review any question</h3>' + C.items.map(function (it) {
      var ok = st.ans[it.id] === it.ans;
      return '<details class="tm"><summary>' + (ok ? '✓' : '✗') + ' ' + it.id + ' · ' + esc(it.cat) + '</summary><div class="stem">' + it.stem + '</div><div class="explain"><b class="h">Right answer</b>' + it.opts[it.ans] + '<br><br>' + it.explain + '</div></details>';
    }).join('') + '</div>';
  }
  return h;
}

/* ---------- step 7: reading check ---------- */
function vS7() {
  var st = STEP.s7;
  if (!S.unlocked.s7) return banner(st) + lockCard('s7', 'Reading check', 'A short reading passage and five questions. No writing in this step. Your tutor will say the code when it is time.');
  var d = D.diag, h = banner(st) + '<div class="card"><div class="cat">Reading passage</div><div class="passage"><h3>' + esc(d.title) + '</h3>';
  d.passage.forEach(function (p) { h += '<p>' + esc(p) + '</p>'; });
  h += '</div></div>';
  var all = d.mc.every(function (q) { return S.diagLocked[q.id]; });
  d.mc.forEach(function (q) {
    var lk = !!S.diagLocked[q.id], sel = S.diag[q.id];
    h += '<div class="card"><div class="cat">' + esc(q.cat) + '</div><div class="stem">' + q.stem + '</div><div class="opts">';
    q.opts.forEach(function (o, i) { h += optBtn(q, i, 'diag', 'dpick', q.id, sel, all).replace(/ disabled/, lk && !all ? ' disabled' : ''); });
    h += '</div>';
    if (all) { var ok = sel === q.ans; h += '<div class="explain' + (ok ? '' : ' warn') + '"><b class="h">' + (ok ? 'Right. Here is why' : 'Here is why the answer is different') + '</b>' + q.explain + '</div>'; }
    else if (lk) h += '<p class="lede">Locked in. You will see the answer after all five.</p>';
    else h += '<div class="row"><button class="btn primary" data-a="dlock" data-id="' + q.id + '"' + (sel == null ? ' disabled' : '') + '>Lock in</button></div>';
    h += '</div>';
  });
  if (all) {
    var ok2 = d.mc.filter(function (q) { return S.diag[q.id] === q.ans; }).length;
    S.diagDone = true; save();
    h += '<div class="card"><h3>Your score: ' + ok2 + ' of ' + d.mc.length + '</h3></div>';
    h += codeBox(S.who + '-D-' + d.mc.map(function (q) { return (S.diag[q.id] + 1); }).join(''), 'Your code for the Reading check', 'Read this to your tutor. It puts your answers on the big screen.');
  }
  return h;
}

/* ---------- step 10: ballot ---------- */
function bk(n) { return D.ballot.books.filter(function (b) { return b.n === n; })[0]; }
function vS10() {
  var st = STEP.s10;
  if (!S.unlocked.s10) return banner(st) + lockCard('s10', 'Choose the next book', 'Ten titles. Read the cards, then choose your top three. Your tutor will say the code when it is time.');
  var h = banner(st) + '<div class="card"><h2>Choose the next book</h2><p class="lede">Pick your <b>top three</b>. First choice counts most. Think about the story, the challenge, and the question each book asks.</p><p class="lede">Your picks: ' + (S.ranks.some(function (x) { return x != null; }) ? S.ranks.map(function (n, i) { return n == null ? null : (i + 1) + '. ' + esc(bk(n).title); }).filter(Boolean).join(' · ') : 'none yet') + '</p></div>';
  D.ballot.books.forEach(function (b) {
    var r = S.ranks.indexOf(b.n);
    h += '<div class="card book"><h3>' + esc(b.title) + (r >= 0 ? '<span class="rk">#' + (r + 1) + '</span>' : '') + '</h3><div class="meta">' + esc(b.author) + ' · ' + esc(b.genre) + ' · ' + esc(b.length) + ' read</div><p class="synopsis">' + esc(b.synopsis) + '</p><p><b>The question it opens:</b> ' + esc(b.through) + '</p><p class="lede"><b>Heads-up:</b> ' + esc(b.heads) + '</p>';
    if (!S.ballotDone) {
      h += '<div class="row">';
      [1, 2, 3].forEach(function (k) { h += '<button class="btn" data-a="rank" data-n="' + b.n + '" data-k="' + k + '" aria-pressed="' + (r === k - 1) + '"' + (r === k - 1 ? ' style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent)"' : '') + '>' + (k === 1 ? '1st' : k === 2 ? '2nd' : '3rd') + '</button>'; });
      h += '<button class="linkbtn" data-a="unrank" data-n="' + b.n + '">Clear</button></div>';
    }
    h += '</div>';
  });
  if (!S.ballotDone) h += '<div class="card"><div class="row"><button class="btn primary" data-a="lockvote"' + (S.ranks.length === 3 && S.ranks.every(function (x) { return x != null; }) ? '' : ' disabled') + '>Lock my ballot</button></div></div>';
  else h += codeBox(S.who + '-V-' + S.ranks.join('-'), 'Your ballot code', 'Read this to your tutor. It adds your votes to the big screen.');
  return h;
}

/* ---------- shell ---------- */
function render() {
  var app = $('#app');
  if (!S.who) {
    app.innerHTML = '<main><div class="card pick"><div class="brand">Nation · Lesson 7</div><h2>Which letter are you?</h2><p class="lede">Your tutor will tell you. You only pick this once.</p><div class="letters">' + ['A', 'B', 'C', 'D'].map(function (l) { return '<button data-a="who" data-l="' + l + '" aria-label="Student ' + l + '">' + l + '</button>'; }).join('') + '</div></div></main>';
    return;
  }
  var tabs = D.steps.map(function (t) {
    return '<button class="tab ' + (isScreen(t) ? 'scr' : 'off') + '" data-a="tab" data-t="' + t.id + '" aria-current="' + (S.tab === t.id) + '">' + esc(tabLabel(t)) + (done(t.id) ? '<span class="tick" aria-label="done">&#10003;</span>' : '') + '</button>';
  }).join('');
  var body = ({ s1: vS1, s2: vS2, s3: function () { return vContest('W'); }, s4: vS4, s5: function () { return vContest('P'); }, s6: vS6, s7: vS7, s8: vS8, s9: vS9, s10: vS10, s11: vS11 })[S.tab]();
  var foot = '<div class="card"><div class="row"><button class="linkbtn" data-a="reset">' + (S.resetAsk ? 'Tap again to erase this device and start over' : 'Start over on this device') + '</button></div></div>';
  var prevScroll = (document.querySelector('.tabs') || {}).scrollLeft;
  app.innerHTML = '<div class="bar"><div class="head"><span class="brand">Nation · Lesson 7</span><span class="who">Student <b>' + S.who + '</b><button class="linkbtn" data-a="chwho">change</button></span></div><nav class="tabs" aria-label="Steps">' + tabs + '</nav></div><main>' + body + foot + '</main>';
  var cur = document.querySelector('.tab[aria-current="true"]');
  if (cur && cur.scrollIntoView) { try { cur.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {} }
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]'); if (!el) return;
  var a = el.getAttribute('data-a'), id = el.getAttribute('data-id');
  if (a === 'who') S.who = el.getAttribute('data-l');
  else if (a === 'chwho') S.who = null;
  else if (a === 'tab') { S.tab = el.getAttribute('data-t'); lockErr = ''; S.resetAsk = false; window.scrollTo(0, 0); }
  else if (a === 'cgo') { var k = el.getAttribute('data-k'); S[k].go = Math.min(3, S[k].go + 1); }
  else if (a === 'cpick') { var p = id.split('|'), kk = p[1], iid = p[0]; if (!S[kk].chk[iid]) S[kk].ans[iid] = +el.getAttribute('data-i'); }
  else if (a === 'ccheck') { var k2 = el.getAttribute('data-k'); S[k2].chk[id] = true; }
  else if (a === 'cnext') { var k3 = el.getAttribute('data-k'); S[k3].seen[id] = true; window.scrollTo(0, 0); }
  else if (a === 'dpick') { if (!S.diagLocked[id]) S.diag[id] = +el.getAttribute('data-i'); }
  else if (a === 'dlock') S.diagLocked[id] = true;
  else if (a === 'unlock') {
    var t = el.getAttribute('data-tab'), v = ($('#codein').value || '').replace(/\s+/g, '').toUpperCase();
    if (v && btoa(v) === CODES[t]) { S.unlocked[t] = true; lockErr = ''; } else lockErr = 'That code is not right. Check the spelling with your tutor.';
  }
  else if (a === 'rank') {
    var n = +el.getAttribute('data-n'), kr = +el.getAttribute('data-k') - 1;
    var arr = [S.ranks[0], S.ranks[1], S.ranks[2]]; var old = arr.indexOf(n); if (old >= 0) arr[old] = undefined; arr[kr] = n;
    S.ranks = arr.map(function (x) { return x === undefined ? null : x; });
    while (S.ranks.length && S.ranks[S.ranks.length - 1] === null) S.ranks.pop();
  }
  else if (a === 'unrank') { var nn = +el.getAttribute('data-n'); var j = S.ranks.indexOf(nn); if (j >= 0) S.ranks[j] = null; while (S.ranks.length && S.ranks[S.ranks.length - 1] === null) S.ranks.pop(); }
  else if (a === 'lockvote') { if (S.ranks.length === 3 && S.ranks.indexOf(null) < 0) S.ballotDone = true; }
  else if (a === 'copy') {
    var t2 = el.getAttribute('data-t'), msg = function (m) { var c = $('#copied'); if (c) c.textContent = m; };
    try { navigator.clipboard.writeText(t2).then(function () { msg('Copied.'); }, function () { sel(); }); } catch (err) { sel(); }
    function sel() { var r = document.createRange(); r.selectNodeContents($('#codeout')); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); msg('Selected. Press Ctrl+C.'); }
    return;
  }
  else if (a === 'reset') { if (S.resetAsk) { S = fresh(); lockErr = ''; } else S.resetAsk = true; }
  save(); render();
});
render();
</script>
</body></html>
