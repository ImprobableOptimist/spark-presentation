<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hitchhiker's Guide Lesson 1</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one single-column working page for a phone or a laptop. A sticky strip names the student and holds the 11 numbered steps, which match the tutor's board and the paper packet. Steps that use the screen show a SCREEN banner; the others tell the student to put the screen down. */
:root {
  --bg: #F3F5FA; --panel: #FFFFFF; --panel2: #E8ECF5; --ink: #14213D; --muted: #55627E; --line: #C9D1E3;
  --accent: #2457D6; --accent-ink: #FFFFFF; --good: #17804A; --good-bg: #DDF3E6; --bad: #B83232; --bad-bg: #F9E0E0;
  --gold: #8F6200; --gold-bg: #FAEFCB; --paper: #7A3E00; --paper-bg: #FDEBD3;
  --f-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif; --f-body: 'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0D1526; --panel: #15213B; --panel2: #1D2C4D; --ink: #E8EEFA; --muted: #9DAAC6; --line: #2C3C60;
    --accent: #88AAFF; --accent-ink: #0D1526; --good: #5BD593; --good-bg: #12392B; --bad: #FF8E8E; --bad-bg: #40191F;
    --gold: #F2C35B; --gold-bg: #3A2D0E; --paper: #FFC88A; --paper-bg: #3D2A12; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0D1526; --panel: #15213B; --panel2: #1D2C4D; --ink: #E8EEFA; --muted: #9DAAC6; --line: #2C3C60;
  --accent: #88AAFF; --accent-ink: #0D1526; --good: #5BD593; --good-bg: #12392B; --bad: #FF8E8E; --bad-bg: #40191F;
  --gold: #F2C35B; --gold-bg: #3A2D0E; --paper: #FFC88A; --paper-bg: #3D2A12; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; overflow-x: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h2 { font-size: 1.45rem; } h3 { font-size: 1.1rem; } p { margin: 0; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px 8px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: .78rem; color: var(--muted); }
.who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: .9rem; }
.who b { font-family: var(--f-display); background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 12px; }
.linkbtn { background: none; border: 0; color: var(--accent); text-decoration: underline; padding: 4px; font-size: .9rem; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-block: 8px 2px; scrollbar-width: thin; }
.tab { flex: 0 0 auto; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 5px 13px; font-size: .9rem; white-space: nowrap; }
.tab.scr { border-color: var(--accent); }
.tab.off { border-style: dashed; color: var(--muted); }
.tab[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; border-style: solid; }
.tab .tick { color: var(--good); font-weight: 800; margin-left: 4px; }
.tab[aria-current="true"] .tick { color: var(--accent-ink); }
main { display: flex; flex-direction: column; gap: 16px; padding-top: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.lede { color: var(--muted); }
.banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-radius: 12px; padding: 10px 14px; border: 2px solid var(--accent); background: var(--panel2); }
.banner .n { font-family: var(--f-display); font-weight: 800; letter-spacing: .08em; font-size: .78rem; }
.banner b { font-family: var(--f-display); font-size: 1.1rem; }
.banner .tags { margin-left: auto; font-family: var(--f-display); font-weight: 800; letter-spacing: .1em; font-size: .78rem; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 2px 10px; }
.banner.off { border-color: var(--paper); background: var(--paper-bg); }
.banner.off .tags { background: var(--paper); color: var(--paper-bg); }
.down { border: 3px solid var(--paper); background: var(--paper-bg); border-radius: 12px; padding: 14px 16px; font-size: 1.1rem; }
.down b { font-family: var(--f-display); letter-spacing: .06em; }
.cat { font-family: var(--f-display); font-weight: 700; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.stem { font-family: var(--f-display); font-weight: 700; font-size: 1.12rem; line-height: 1.35; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0; }
.opt .n { font-family: var(--f-display); font-weight: 800; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--panel2); }
.opt .t { padding-top: 3px; overflow-wrap: anywhere; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--panel2); }
.opt[aria-pressed="true"] .n { background: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.right .n { background: var(--good); color: var(--bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .n { background: var(--bad); color: var(--bg); }
.opt .why { grid-column: 2; font-size: .95rem; color: var(--muted); }
.opt.wrong .why, .opt.right .why { color: var(--ink); }
.opt:disabled { cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rate { display: flex; flex-direction: column; gap: 8px; padding-block: 6px; border-top: 1px dashed var(--line); }
.sure { display: flex; flex-direction: column; gap: 6px; }
.btn { background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 9px 16px; font-weight: 700; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.explain { border-left: 6px solid var(--good); background: var(--good-bg); border-radius: 8px; padding: 12px 14px; }
.explain.warn { border-color: var(--gold); background: var(--gold-bg); }
.explain b.h { font-family: var(--f-display); letter-spacing: .06em; text-transform: uppercase; font-size: .72rem; display: block; margin-bottom: 2px; }
.pts { font-family: var(--f-display); font-weight: 800; }
.code { display: flex; gap: 12px; flex-wrap: wrap; }
.code span { font-family: var(--f-display); font-weight: 800; font-size: 2.6rem; line-height: 1; min-width: 64px; text-align: center; background: var(--panel2); border: 2px solid var(--accent); border-radius: 12px; padding: 12px 14px; }
.tell { border: 3px solid var(--accent); }
.lock { display: flex; flex-direction: column; gap: 12px; }
.lock input { font-size: 1.3rem; text-transform: uppercase; letter-spacing: .1em; padding: 10px 14px; border: 2px solid var(--line); border-radius: 10px; background: var(--panel); width: min(100%, 320px); }
.err { color: var(--bad); font-weight: 700; min-height: 1.4em; }
.passage { display: flex; flex-direction: column; gap: 12px; max-width: 65ch; }
.rk { font-family: var(--f-display); font-weight: 800; background: var(--gold-bg); color: var(--gold); border: 2px solid var(--gold); border-radius: 8px; padding: 0 10px; margin-left: 8px; }
.score { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; }
.pick { display: grid; place-items: center; gap: 14px; padding-block: 30px; text-align: center; }
.pick .letters { display: flex; gap: 12px; }
.pick .letters button { width: 72px; height: 72px; font-size: 1.8rem; font-family: var(--f-display); font-weight: 800; border-radius: 16px; background: var(--panel); border: 2px solid var(--line); }
.pick .letters button:hover { border-color: var(--accent); }
.term { border: 1px solid var(--line); border-left: 6px solid var(--accent); border-radius: 10px; padding: 10px 14px; background: var(--panel); display: flex; flex-direction: column; gap: 4px; }
.term h4 { margin: 0; font-family: var(--f-display); font-size: 1rem; }
.term .ex { background: var(--panel2); border-radius: 8px; padding: 8px 12px; font-size: .97rem; overflow-wrap: anywhere; }
.rule { border: 1px solid var(--line); border-left: 6px solid var(--gold); border-radius: 10px; padding: 12px 14px; background: var(--panel); display: flex; flex-direction: column; gap: 6px; }
.rule h4 { margin: 0; font-family: var(--f-display); font-size: 1.05rem; }
.rule .id { font-family: var(--f-display); font-weight: 800; background: var(--gold-bg); color: var(--gold); border-radius: 6px; padding: 0 8px; margin-right: 8px; }
.pair { display: grid; gap: 6px; }
.pair .w, .pair .r { border-radius: 8px; padding: 8px 12px; overflow-wrap: anywhere; }
.pair .w { background: var(--bad-bg); } .pair .r { background: var(--good-bg); }
.pair .lab { font-family: var(--f-display); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; display: block; color: var(--muted); }
details.tm { border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; }
details.tm > summary { cursor: pointer; font-weight: 700; color: var(--accent); }
details.tm[open] > summary { margin-bottom: 8px; }
details.tm > * + * { margin-top: 8px; }
.wc { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; background: var(--panel); }
.wc h4 { margin: 0; font-family: var(--f-display); font-size: 1.15rem; }
.wc .p { color: var(--muted); font-size: .92rem; }
.rules-box { background: var(--panel2); border-radius: 10px; padding: 10px 14px; }
.book { display: flex; flex-direction: column; gap: 8px; }
.book .meta { color: var(--muted); font-size: .9rem; }
.synopsis { font-size: 1rem; }
@media (max-width: 480px) { .stem { font-size: 1.05rem; } .code span { font-size: 2rem; min-width: 52px; } }
@media (prefers-reduced-motion: no-preference) { .opt { transition: border-color .15s, background .15s; } }
</style>
</head><body><div class="wrap" id="app"></div>
<script>
var D = {"meta":{"date":"2026.11.14","key":"hh-l1-v2","brand":"Hitchhiker's Guide · Lesson 1"},"scoring":{"correct":2,"streakAt":3,"streakBonus":1,"roundWin":2},"steps":[{"n":1,"id":"s1","kind":"talk","name":"Homework check","short":"Homework","tags":["TALK"],"min":6,"students":"Screens down. Reading Logs out. Books closed.","what":"Your tutor initials your Reading Log, then asks two questions about Chapters 1 and 2 out loud. Nothing to type."},{"n":2,"id":"s2","kind":"starter","name":"Starter: where are you now?","short":"Starter","tags":["SCREEN"],"min":5,"students":"Screens up. Student Page, tab 2.","what":"Five quick taps. Three ask how well you know a literary device (there are no right answers). Two ask about words from the Nation unit. Not graded. Your tutor will say the code when it is time."},{"n":3,"id":"s3","kind":"devices","name":"Devices: learn three and write them down","short":"Devices","tags":["TALK","PAPER"],"min":10,"students":"Screens down. Listen while your tutor teaches three literary devices. Then write each one in your own words in your Field Guide, page 1. This tab holds the same cards to look back at later.","what":"Three tools Douglas Adams uses to be funny. Each has a name, a meaning in plain words and an example from Chapters 1 and 2. After all three, you write each one in your own words in your Field Guide."},{"n":4,"id":"s4","kind":"spot","name":"Reread and spot","short":"Reread","tags":["TALK","PAPER"],"min":16,"students":"Screens down. Book open to Chapter 1. Paper sheet 1, front, STEP 4.","what":"We reread one page of Chapter 1 together. Then, on the front of paper sheet 1, you name the device in four short moments and write privately in the box at the bottom. Nobody has to share what they wrote."},{"n":5,"id":"s5","kind":"contest","contest":"W","name":"Vocabulary contest","short":"Vocab contest","tags":["SCREEN"],"min":12,"students":"Screens up. Student Page, tab 5.","what":"Study nine word cards, then play three rounds against each other. Your tutor will say the code when it is time."},{"n":6,"id":"s6","kind":"rules","name":"Commas: learn the rules and write them down","short":"Comma rules","tags":["TALK","PAPER"],"min":7,"students":"Screens down. Listen while your tutor teaches three comma rules. Then write each rule in your own words in your Field Guide, page 3. This tab holds the same cards to look back at later.","what":"Three comma rules that fix most comma mistakes on the SAT and ACT. Each has a name, a plain-words rule and a Wrong and Right example. After all three, you write each rule in your own words in your Field Guide."},{"n":7,"id":"s7","kind":"contest","contest":"P","name":"Comma contest","short":"Comma contest","tags":["SCREEN"],"min":9,"students":"Screens up. Student Page, tab 7.","what":"Three rounds against each other: pick the sentence that is punctuated correctly. Your tutor will say the code when it is time."},{"n":8,"id":"s8","kind":"read","name":"Read ahead: Chapter 3","short":"Read ahead","tags":["TALK"],"min":12,"students":"Screens down. Book open to Chapter 3.","what":"We read part of Chapter 3 together, out loud, and stop to talk. Have your book open. Nothing to type or write."},{"n":9,"id":"s9","kind":"writing","name":"Writing lab","short":"Writing","tags":["PAPER","TALK"],"min":14,"students":"Screens down. Paper sheet 1, back, STEP 9.","what":"You study a model paragraph on the back of paper sheet 1, label its parts, and then write ONE paragraph of your own. Everything you need is on the sheet."},{"n":10,"id":"s10","kind":"wrap","name":"Wrap and homework","short":"Wrap","tags":["TALK"],"min":5,"students":"Screens down. Paper sheets and Field Guide out.","what":"Homework for next lesson: read Chapters 3 to 10 and fill in your Reading Log (paper sheet 2, front) while you read. Do the short AI task on the back of the log. Then three small jobs in your Field Guide."}],"devices":[{"id":"V","name":"Verbal irony","say":"Saying the opposite of what you mean, and expecting the listener to notice. Sarcasm is the sharp, mocking kind of verbal irony.","ex":"Chapter 1: Mr. Prosser says the plans were \"on display.\" Arthur agrees out loud, then describes where they really were: in a dark cellar, in a locked filing cabinet, behind a warning sign. He does not mean they were on display. He means they were hidden.","not":"Not a lie. A liar hopes you believe the words. An ironic speaker hopes you see through them."},{"id":"D","name":"Dramatic irony","say":"The reader or audience knows something important that a character does not know. We watch the character act without that knowledge.","ex":"Chapter 1: Arthur thinks his friend Ford Prefect is an ordinary, slightly odd man. The narrator has already told us where Ford is really from. Every time Arthur treats Ford as a normal friend, we know more than Arthur does.","not":"Not a surprise twist. In a twist, the reader is fooled too. In dramatic irony, the reader is ahead of the character."},{"id":"U","name":"Understatement","say":"Describing something big, serious or shocking as if it were small or ordinary. The gap between the size of the thing and the smallness of the words is the joke.","ex":"Chapter 2: in the pub, Ford mentions that the world is about to end in the same calm way he orders drinks. The news could not be bigger; his words and tone could hardly be smaller.","not":"The opposite is hyperbole: describing something as far bigger than it is (\"I have told you a million times\"). We will name hyperbole next lesson."}],"symbolNote":"New Reading Log symbol: ≠ (not equal). It marks irony: what is said or expected is NOT what is meant or what happens. Write ≠ in your log beside the chapter and scene. (Typed, it can be =/.)","starter":{"title":"Starter: where are you now?","p1Head":"Part 1 · How well do you know each device?","p1Note":"There are no right answers and no grade. An honest answer helps your tutor teach today.","scale":["I have never heard of it","I have heard it, but I cannot explain it","I can explain it","I could teach it to someone"],"rate":[{"id":"R1","name":"Verbal irony"},{"id":"R2","name":"Dramatic irony"},{"id":"R3","name":"Understatement"}],"p2Head":"Part 2 · Two words from the Nation unit","p2Note":"Pick an answer, say how sure you are, then press Check. You will see right away why the answer is right.","confScale":["Guessing","Not sure","Pretty sure","Certain"],"recall":[{"id":"T1","cat":"From the Nation unit","rule":"culpable","stem":"A person who is <b>culpable</b> is...","opts":["deserving of blame for something that went wrong.","fair to both sides of an argument.","accepted as rightful or lawful.","likely to make a bad situation worse."],"ans":0,"why":[null,"That is <i>impartial</i>. A judge should be impartial. A culpable person is the one who is being blamed.","That is <i>legitimate</i>. Legitimate is about being accepted as rightful; culpable is about deserving blame.","That is the idea of <i>exacerbate</i>, which is a verb. Culpable is an adjective about blame, not about what happens next."],"explain":"<b>Culpable</b> means deserving blame (Latin <i>culpa</i>, \"fault\"). From the Nation unit: the culpable person is the one who is at fault."},{"id":"T2","cat":"From the Nation unit","rule":"mitigate","stem":"To <b>mitigate</b> a problem is to...","opts":["make it worse.","make a plan for it.","make it less severe.","blame someone for it."],"ans":2,"why":["That is <i>exacerbate</i>, the opposite. Mitigate means to reduce a problem, not to increase it.","A plan is a <i>stratagem</i>, which is a noun. Mitigate is a verb about what you do to the problem itself.",null,"Blame is the idea inside <i>culpable</i>. To mitigate is to lessen the problem, not to decide whose fault it is."],"explain":"<b>Mitigate</b> means to make something less severe (Latin <i>mitigare</i>, \"to soften\"). From the Nation unit: a wall can mitigate a flood by softening its force."}],"codeNote":"Read these seven numbers to your tutor, in order: three ratings, then your answer and your sureness for each word."},"fgNote":"Field Guide homework (about five minutes): your own example for ONE device (page 1), your own example sentence for ONE comma rule (page 3), and TWO word roots from the word cards (page 4).","vocab":[{"word":"insignificant","pos":"adjective","pron":"in-sig-NIF-ih-kunt","ety":"Latin in- (\"not\") + significare (\"to show by a sign, to mean\"). Something insignificant does not signify: it means nothing much.","def":"Too small or unimportant to matter.","syn":"trivial, minor, negligible","ant":"important, major, momentous","textEx":"The opening pages: the narrator introduces the Earth as a small planet that the rest of the Galaxy has no reason to notice.","usageEx":"The error looked insignificant, but it changed the answer by a factor of ten."},{"word":"primitive","pos":"adjective","pron":"PRIM-ih-tiv","ety":"Latin primitivus (\"first of its kind\"), from primus (\"first\"). The same root is in primary and prime.","def":"Belonging to an early, simple stage of development; not advanced.","syn":"early, crude, undeveloped","ant":"advanced, modern, sophisticated","textEx":"The opening pages: the narrator says the people of Earth are so primitive that they are still impressed by digital watches.","usageEx":"The first telephones look primitive beside the one in your pocket."},{"word":"demolish","pos":"verb","pron":"dih-MOL-ish","ety":"Latin de- (\"down\") + moliri (\"to build\"). To demolish is to un-build: to take a structure down.","def":"To tear down or destroy completely.","syn":"raze, flatten, wreck","ant":"build, construct, restore","textEx":"Chapter 1: the council has sent a bulldozer to demolish Arthur's house.","usageEx":"The crew will demolish the old bridge once the new one opens."},{"word":"eccentric","pos":"adjective (also a noun)","pron":"ek-SEN-trik","ety":"Greek ek (\"out of\") + kentron (\"center\"). Astronomers first used it for an orbit that is off-center. An eccentric person is a little off-center too.","def":"Odd or unusual in a harmless way; not behaving the way most people do.","syn":"quirky, unconventional, odd","ant":"ordinary, conventional, typical","textEx":"Chapter 1: the humans who know Ford Prefect see him as odd but harmless: a man a little off-center from everyone else.","usageEx":"Her eccentric uncle keeps bees on the roof and names every one of them."},{"word":"illusion","pos":"noun","pron":"ih-LOO-zhun","ety":"Latin illudere (\"to mock, to play with\"), from ludere (\"to play\"). An illusion plays a trick on your senses or your mind.","def":"Something that seems real or true but is not.","syn":"mirage, false impression, fantasy","ant":"reality, fact, truth","textEx":"Chapter 2: in the pub, Ford tells Arthur that time is an illusion, and lunchtime even more so.","usageEx":"The mirrors give the illusion that the small room is twice its size."},{"word":"bureaucracy","pos":"noun","pron":"byoo-ROK-ruh-see","ety":"French bureau (\"desk, office\") + Greek -kratia (\"rule\"). Bureaucracy is rule by desks. Compare democracy: rule by the people.","def":"A system run by offices, forms and fixed procedures, often slow and hard to argue with.","syn":"officialdom, red tape, administration","ant":"informality, flexibility, common sense","textEx":"The word is not in the chapters, but the thing is: Mr. Prosser's council, with its plans, its offices and its proper time to complain.","usageEx":"It took three forms and two signatures to change one light bulb: bureaucracy at work."},{"word":"oblivious","pos":"adjective","pron":"uh-BLIV-ee-us","ety":"Latin oblivisci (\"to forget\"). It once meant forgetful; now it means not noticing in the first place.","def":"Not aware of what is happening around you.","syn":"unaware, unconscious of, heedless","ant":"aware, alert, mindful","textEx":"Arthur for most of Chapters 1 and 2: oblivious to who his friend really is and to what kind of day this is going to be.","usageEx":"Headphones on, he was oblivious to the bus pulling away without him."},{"word":"nonchalant","pos":"adjective","pron":"non-shuh-LAHNT","ety":"French non (\"not\") + chaloir (\"to matter, to concern\"), from Latin calere (\"to be warm\"). A nonchalant person does not get heated. (The same Latin root gave us calenture, the fever word from Nation.)","def":"Calm and casual, as if not worried or not interested.","syn":"casual, unconcerned, cool","ant":"anxious, agitated, concerned","textEx":"Ford in the pub in Chapter 2: nonchalant about news that would make anyone else scream.","usageEx":"She gave a nonchalant shrug, but her hands were shaking."},{"word":"imminent","pos":"adjective","pron":"IM-ih-nunt","ety":"Latin imminere (\"to overhang, to loom over\"). Something imminent is hanging over you, about to drop.","def":"About to happen very soon.","syn":"impending, approaching, looming","ant":"distant, remote, far-off","textEx":"Chapters 1 and 2: for Arthur, the loss of his house is imminent. Ford knows that something much larger is imminent too.","usageEx":"Dark clouds and a sudden wind told us that rain was imminent."}],"wItems":[{"id":"W1","cat":"Meaning","rule":"insignificant","stem":"Something <b>insignificant</b> is...","opts":["about to happen very soon.","from an early, simple stage of development.","too small or unimportant to matter.","not real, although it looks real."],"ans":2,"why":["That is <i>imminent</i>. Imminent is about WHEN something happens; insignificant is about how much it matters.","That is <i>primitive</i>. A primitive tool can still matter a great deal; insignificant means it does not matter.",null,"That is an <i>illusion</i>. An insignificant thing is real. It just is not important."],"explain":"<b>Insignificant</b> is Latin <i>in-</i> (\"not\") + <i>significare</i> (\"to mean\"). An insignificant thing does not mean much: it is too small or unimportant to matter. The narrator uses the idea for the Earth itself."},{"id":"W2","cat":"Meaning","rule":"eccentric","stem":"Which person is <b>eccentric</b>?","opts":["A neighbor who wears a cape to the grocery store and talks to his tomato plants.","A student who does not notice the fire drill because she is deep in a book.","A goalkeeper who shrugs calmly after letting in a goal.","A clerk who needs three forms signed before he will lend you a pencil."],"ans":0,"why":[null,"She is <i>oblivious</i>: not aware of what is happening around her. Nothing about her is odd.","He is <i>nonchalant</i>: calm and casual. A calm shrug is not unusual behavior.","That is <i>bureaucracy</i>: rule by forms and procedures. The clerk is following the normal rules, not behaving oddly."],"explain":"<b>Eccentric</b> is Greek <i>ek</i> (\"out of\") + <i>kentron</i> (\"center\"): off-center. An eccentric person is odd in a harmless way, like the neighbor in the cape."},{"id":"W3","cat":"Meaning","rule":"oblivious","stem":"A person who is <b>oblivious</b> to a problem...","opts":["notices it but stays cool and unbothered.","tears it down completely.","expects it to arrive at any moment.","does not notice it at all."],"ans":3,"why":["That is <i>nonchalant</i>. The nonchalant person HAS noticed and acts calm. The oblivious person has not noticed.","That is <i>demolish</i>, a verb. Oblivious is an adjective about not being aware.","A person who expects something is aware of it. That is the opposite of oblivious. (The thing itself would be <i>imminent</i>.)",null],"explain":"<b>Oblivious</b> comes from Latin <i>oblivisci</i>, \"to forget.\" Today it means not aware of what is happening around you. The key difference from <i>nonchalant</i>: oblivious people have not noticed; nonchalant people have noticed and stay calm."},{"id":"W4","cat":"In context","rule":"imminent","stem":"The sky turned green and the sirens began to wail. Everyone could tell that the storm was ______.","opts":["eminent","imminent","insignificant","primitive"],"ans":1,"why":["A look-alike. <i>Eminent</i> means famous and respected (an eminent scientist). A storm cannot be famous and respected, but it can be about to arrive.",null,"<i>Insignificant</i> means too small to matter. Sirens are the sign that this storm matters a great deal.","<i>Primitive</i> means from an early, simple stage. It says nothing about how soon something will happen."],"explain":"<b>Imminent</b> means about to happen very soon (Latin <i>imminere</i>, \"to loom over\"). The clues are the green sky and the sirens: signs that the storm is about to arrive. Watch for the look-alike <i>eminent</i>, which means famous and respected."},{"id":"W5","cat":"In context","rule":"demolish","stem":"The city plans to ______ the old stadium and build a park where it stood.","opts":["mitigate","exacerbate","illusion","demolish"],"ans":3,"why":["From the Nation unit: <i>mitigate</i> means to make something less severe. You mitigate harm or a problem, not a building.","From the Nation unit: <i>exacerbate</i> means to make a bad situation worse. A stadium is not a situation, and the park clue points to tearing it down.","<i>Illusion</i> is a noun. After \"plans to\" the sentence needs a verb.",null],"explain":"<b>Demolish</b> means to tear down completely (Latin <i>de-</i>, \"down,\" + <i>moliri</i>, \"to build\"). The clue is \"build a park where it stood\": the stadium has to come down first."},{"id":"W6","cat":"In context","rule":"nonchalant","stem":"Although the fire alarm was ringing, Dev gave a ______ shrug and finished his sandwich.","opts":["nonchalant","oblivious","imminent","eccentric"],"ans":0,"why":[null,"Close, but Dev shrugs AT the alarm, so he has noticed it. <i>Oblivious</i> means not noticing at all.","<i>Imminent</i> means about to happen. A shrug cannot be about to happen; it describes events, not attitudes.","<i>Eccentric</i> means odd in a harmless way. The clue \"Although the alarm was ringing\" sets up calm against danger, not odd against normal."],"explain":"<b>Nonchalant</b> means calm and casual, as if not worried (French <i>non</i> + <i>chaloir</i>, \"not to matter\"). \"Although\" sets up a contrast: the alarm is urgent, and Dev's shrug is not. He has heard the alarm, so he is nonchalant, not oblivious."},{"id":"W7","cat":"Root","rule":"bureaucracy","stem":"<b>Bureaucracy</b> joins French <i>bureau</i> (\"desk, office\") and Greek <i>-kratia</i> (\"rule\"). Which situation shows <b>bureaucracy</b>?","opts":["A king makes every decision himself and explains none of them.","To change one light bulb, a school must file a form, collect two signatures and book an approved technician.","Neighbors settle a question by raising their hands at a street meeting.","A crew tears down a wall in a single afternoon."],"ans":1,"why":["That is rule by one person. There are no desks, forms or procedures, so it is not bureaucracy.",null,"That is rule by the people voting directly: democracy on a small scale. Bureaucracy is rule by offices and procedures.","That is <i>demolish</i>. Nothing here involves offices, forms or rules."],"explain":"<b>Bureaucracy</b> is rule by desks: a system run by offices, forms and fixed procedures. The light bulb needs a form, two signatures and an approved technician. That is the same kind of system that told Arthur there was a proper time to complain."},{"id":"W8","cat":"Root","rule":"illusion","stem":"<b>Illusion</b> comes from Latin <i>illudere</i>, \"to mock, to play with.\" Which is an <b>illusion</b>?","opts":["A real puddle left by last night's rain.","A school rule that everyone ignores.","On a hot road, a shining puddle that vanishes as you drive toward it.","A clever plan to fool an opponent."],"ans":2,"why":["A real puddle is real. An illusion only seems real.","The rule really exists, even if nobody follows it. You might call it <i>insignificant</i>, but it is not an illusion.",null,"From the Nation unit: that is a <i>stratagem</i>, a plan. An illusion is a false appearance, not a plan."],"explain":"An <b>illusion</b> is something that seems real but is not. The root says it plays with you: the puddle on the hot road looks like water and is only light. Ford uses the word about time itself."},{"id":"W9","cat":"From before","rule":"primitive","stem":"Parked next to a starship, a horse and cart looks ______.","opts":["primitive","culpable","impartial","legitimate"],"ans":0,"why":[null,"From the Nation unit: <i>culpable</i> means deserving blame. The cart has done nothing wrong.","From the Nation unit: <i>impartial</i> means fair to both sides. It describes judges, not vehicles.","From the Nation unit: <i>legitimate</i> means accepted as rightful. It says nothing about how old or simple something is."],"explain":"<b>Primitive</b> means from an early, simple stage of development (Latin <i>primus</i>, \"first\"). Beside a starship, a cart belongs to a much earlier stage. The narrator says the same about the people of Earth. The three wrong options are words from the Nation unit: culpable (to blame), impartial (fair to both sides), legitimate (rightful)."}],"wRounds":[{"name":"Round 1 · Meanings","ids":["W1","W2","W3"]},{"name":"Round 2 · In context","ids":["W4","W5","W6"]},{"name":"Round 3 · Roots and words from before","ids":["W7","W8","W9"]}],"pItems":[{"id":"P1","cat":"Lists","rule":"C1","stem":"Which sentence is punctuated correctly?","opts":["Arthur found mud a bulldozer, and a man with a clipboard outside his house.","Arthur found mud, a bulldozer, and a man with a clipboard outside his house.","Arthur, found mud, a bulldozer, and a man with a clipboard outside his house.","Arthur found, mud, a bulldozer, and a man with a clipboard outside his house."],"ans":1,"why":["There is no comma between 'mud' and 'a bulldozer'. In a list, every item except the last needs a comma after it (Rule C1).",null,"The first comma separates the subject 'Arthur' from its verb 'found'. Never put a comma between a subject and its verb.","The comma after 'found' splits the verb from the first thing found. Commas go between the items, not before the first one."],"explain":"<b>Rule C1.</b> A list of three things (mud, a bulldozer, a man with a clipboard) takes a comma after each item except the last, with 'and' before the last item."},{"id":"P2","cat":"Lists","rule":"C1","stem":"Which sentence is punctuated correctly?","opts":["Ford ordered peanuts, and six pints.","Ford ordered, peanuts and six pints.","Ford, ordered peanuts and six pints.","Ford ordered peanuts and six pints."],"ans":3,"why":["There are only two things here. A list needs three or more items before it takes commas (Rule C1), and 'six pints' is not a complete sentence, so Rule C3 does not apply either.","The comma splits the verb 'ordered' from the things ordered.","The comma separates the subject 'Ford' from its verb 'ordered'. Never put a comma between a subject and its verb.",null],"explain":"<b>Rule C1 has a limit.</b> Commas separate the items in a list of THREE or more. Two things joined by 'and' need no comma at all: peanuts and six pints."},{"id":"P3","cat":"Openers","rule":"C2","stem":"Which sentence is punctuated correctly?","opts":["After the bulldozer arrived, Arthur ran outside in his dressing gown.","After the bulldozer arrived Arthur ran outside in his dressing gown.","After the bulldozer, arrived Arthur ran outside in his dressing gown.","After, the bulldozer arrived Arthur ran outside in his dressing gown."],"ans":0,"why":[null,"The comma after the opener is missing. Without it, the opener runs straight into the main sentence (Rule C2).","The comma is inside the opener. It cuts 'the bulldozer' off from its own verb, 'arrived'.","The comma comes after only the first word. The whole opener is 'After the bulldozer arrived', and the comma belongs at its end."],"explain":"<b>Rule C2.</b> 'After the bulldozer arrived' is an opener: it sets the scene but cannot stand alone. The comma goes where the opener ends, just before the subject of the main sentence (Arthur)."},{"id":"P4","cat":"Openers","rule":"C2","stem":"Which sentence is punctuated correctly?","opts":["Without any warning the foreman, started the engine.","Without, any warning the foreman started the engine.","Without any warning, the foreman started the engine.","Without any warning the foreman started, the engine."],"ans":2,"why":["The comma separates the subject 'the foreman' from its verb 'started', and the comma after the opener is missing.","The comma cuts the opener in half. The opener is all three words: 'Without any warning'.",null,"The comma splits the verb 'started' from the thing started, and the comma after the opener is missing."],"explain":"<b>Rule C2.</b> An opener does not have to contain a verb. 'Without any warning' sets the scene, so it gets a comma after it. The main sentence starts at its subject: the foreman."},{"id":"P5","cat":"Joining words","rule":"C3","stem":"Which sentence is punctuated correctly?","opts":["Arthur shouted at the foreman, but the bulldozer did not move.","Arthur shouted at the foreman but, the bulldozer did not move.","Arthur shouted at the foreman but the bulldozer did not move.","Arthur shouted, at the foreman but the bulldozer did not move."],"ans":0,"why":[null,"The comma is on the wrong side of 'but'. The comma that joins two sentences goes BEFORE the joining word.","'Arthur shouted at the foreman' and 'the bulldozer did not move' are both complete sentences. When 'but' joins two complete sentences, it needs a comma before it (Rule C3).","The comma splits 'shouted' from 'at the foreman', and the comma before 'but' is missing."],"explain":"<b>Rule C3.</b> Both halves are complete sentences: each has its own subject (Arthur, the bulldozer) and verb. When a joining word such as 'but' connects two complete sentences, the comma goes before it."},{"id":"P6","cat":"Joining words","rule":"C3","stem":"Which sentence is punctuated correctly?","opts":["Ford finished his drink, and walked to the door.","Ford finished his drink and, walked to the door.","Ford, finished his drink and walked to the door.","Ford finished his drink and walked to the door."],"ans":3,"why":["What follows 'and' ('walked to the door') has no subject of its own, so it is not a complete sentence. No comma is needed (Rule C3).","A comma right after 'and' never belongs here. It separates the joining word from the words it joins.","The comma separates the subject 'Ford' from its verb 'finished'.",null],"explain":"<b>Rule C3 has a trap.</b> The comma goes before a joining word only when what comes after it could stand alone as a sentence. 'Walked to the door' cannot (who walked?), so there is no comma. Ford is the subject of both actions."},{"id":"P7","cat":"Mixed","rule":"C1 + C2","stem":"Which sentence is punctuated correctly?","opts":["When the pub opened Ford bought peanuts, crisps, and six pints.","When the pub opened, Ford bought peanuts, crisps, and six pints.","When the pub opened, Ford bought peanuts crisps, and six pints.","When the pub opened, Ford bought, peanuts, crisps, and six pints."],"ans":1,"why":["The comma after the opener 'When the pub opened' is missing (Rule C2). The list commas are right.",null,"There is no comma between 'peanuts' and 'crisps' (Rule C1). The opener comma is right.","The comma after 'bought' splits the verb from the first thing bought. Commas go between the items, not before the first one."],"explain":"<b>Rules C2 and C1 together.</b> One comma ends the opener ('When the pub opened,'). Then the list of three things takes a comma after each item except the last."},{"id":"P8","cat":"Mixed","rule":"C2 + C3","stem":"Which sentence is punctuated correctly?","opts":["Although the sky was clear Ford kept looking up, and Arthur started to worry.","Although the sky was clear, Ford kept looking up and, Arthur started to worry.","Although the sky was clear, Ford kept looking up, and Arthur started to worry.","Although the sky was clear, Ford kept looking up and Arthur started to worry."],"ans":2,"why":["The comma after the opener 'Although the sky was clear' is missing (Rule C2). The comma before 'and' is right.","The comma sits after 'and' instead of before it. The comma that joins two sentences goes before the joining word (Rule C3).",null,"'Ford kept looking up' and 'Arthur started to worry' are both complete sentences, so 'and' needs a comma before it (Rule C3)."],"explain":"<b>Rules C2 and C3 together.</b> One comma ends the opener ('Although the sky was clear,'). A second comma comes before 'and' because 'Ford kept looking up' and 'Arthur started to worry' are both complete sentences."},{"id":"P9","cat":"Mixed","rule":"C3 + C1","stem":"Which sentence is punctuated correctly?","opts":["The barman wanted quiet so he polished glasses, wiped tables, and hummed.","The barman wanted quiet, so he polished glasses wiped tables, and hummed.","The barman wanted quiet, so, he polished glasses, wiped tables, and hummed.","The barman wanted quiet, so he polished glasses, wiped tables, and hummed."],"ans":3,"why":["The comma before 'so' is missing. 'The barman wanted quiet' and 'he polished glasses...' are both complete sentences (Rule C3).","There is no comma between the first two items in the list: 'polished glasses' and 'wiped tables' (Rule C1).","The comma after 'so' interrupts the sentence for no reason. The comma goes before the joining word, not after it.",null],"explain":"<b>Rules C3 and C1 together.</b> A comma goes before 'so' because both halves are complete sentences. Then the three things the barman did (polished glasses, wiped tables, hummed) form a list, with a comma after each item except the last."}],"pRounds":[{"name":"Round 1 · Lists and openers","ids":["P1","P2","P3"]},{"name":"Round 2 · Openers and joining words","ids":["P4","P5","P6"]},{"name":"Round 3 · Mixed","ids":["P7","P8","P9"]}],"rules":[{"id":"C1","name":"Commas in a list","group":"Commas","say":"In a list of three or more things, put a comma after each item except the last. 'And' goes before the last item. A list of only two things needs no comma.","right":"Ford packed a towel, a notebook, and a bag of peanuts.","wrong":"Ford packed a towel a notebook and a bag of peanuts."},{"id":"C2","name":"Comma after an opener","group":"Commas","say":"If a sentence starts with a word or group of words that sets the scene before the main sentence begins (an opener), put a comma where the opener ends. Find the subject of the main sentence: the comma goes just before it.","right":"Before the bulldozer arrived, Arthur was asleep.","wrong":"Before the bulldozer arrived Arthur was asleep."},{"id":"C3","name":"Comma before a joining word","group":"Commas","say":"When one of the joining words (for, and, nor, but, or, yet, so) connects two complete sentences, put a comma before it. If what comes after the joining word is not a complete sentence, no comma.","right":"Arthur was angry, but he stayed in the mud.   |   No comma needed: Arthur was angry but stayed in the mud.","wrong":"Arthur was angry but he stayed in the mud."}],"terms":[{"id":"sentence","name":"Complete sentence","say":"A group of words with a subject, a main verb and a finished thought. It can stand alone.","ex":"Arthur lay down in the mud."},{"id":"subject","name":"Subject","say":"The who or what the sentence is about.","ex":"<b>Arthur</b> lay down in the mud. (Who lay down? Arthur.)"},{"id":"verb","name":"Main verb","say":"The word that says what the subject does or is.","ex":"Arthur <b>lay</b> down in the mud."},{"id":"opener","name":"Opener (introductory element)","say":"A word or group of words at the start of a sentence that sets the scene but cannot stand alone. It gets a comma after it.","ex":"<b>Before the bulldozer arrived</b>, Arthur was asleep."},{"id":"joining","name":"Joining word (coordinating conjunction)","say":"One of seven small words: for, and, nor, but, or, yet, so. A comma plus one of them can join two complete sentences.","ex":"Arthur was angry<b>, but</b> he stayed in the mud."},{"id":"claim","name":"Claim, Evidence, Reasoning","say":"Claim: your answer. Evidence: one specific proof from the text. Reasoning: an explanation of how the evidence proves the claim.","ex":"Claim: Adams makes the argument funny with verbal irony. Evidence: Arthur agrees the plans were \"on display.\" Reasoning: the reader can see he means the opposite."},{"id":"concession","name":"Concession","say":"Admit a fair point from the other side, then explain why your claim still stands. A real concession grants something true; it does not insult the other side.","ex":"<i>It is true that</i> the scene is also sad. <i>Even so</i>, the irony keeps us laughing."}]};

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function fresh() { return { who: null, tab: 's1', unlocked: {}, st: { rate: {}, ans: {}, conf: {}, chk: {} }, W: { ans: {}, chk: {}, seen: {}, go: 0 }, P: { ans: {}, chk: {}, seen: {}, go: 0 }, diag: {}, diagLocked: {}, ranks: [], ballotDone: false, resetAsk: false }; }
var S = (function () { var f = fresh(), o = load(); if (o && typeof o === 'object') { for (var k in o) f[k] = o[k]; } return f; })();

  if (st.contest === 'W') CONTEST.W = { step: st.id, items: D.wItems, rounds: D.wRounds, title: st.name };

});

function $(s) { return document.querySelector(s); }

function isScreen(st) { return st.tags.indexOf('SCREEN') >= 0; }

/* ---------- contest scoring (the board uses the same rules) ---------- */
function cScore(items, picks) {
  var sc = D.scoring, streak = 0, per = [0, 0, 0], tot = 0, pts = [];
  for (var i = 0; i < items.length; i++) {
    if (picks[i] == null) break;
    var ok = picks[i] === items[i].ans, p = 0;
    if (ok) { streak++; p = sc.correct + (streak >= sc.streakAt ? sc.streakBonus : 0); } else streak = 0;
    pts.push({ p: p, ok: ok, streak: streak }); per[Math.floor(i / 3)] += p; tot += p;
  }
  return { pts: pts, per: per, tot: tot };
}
function cPicks(k) { var C = CONTEST[k], st = S[k]; return C.items.map(function (it) { return st.chk[it.id] ? st.ans[it.id] : null; }); }
function roundDone(k, ri) { var C = CONTEST[k]; return C.rounds[ri].ids.every(function (id) { return S[k].seen[id]; }); }
function contestDone(k) { return roundDone(k, 2); }
function done(id) {
  var st = STEP[id];
  if (st && st.contest) return contestDone(st.contest);
  if (st && st.kind === 'starter') return starterDone();
  return false;
}

/* ---------- starter (self-rating + two retrieval items) ---------- */
function starterDone() {
  var T = D.starter, s = S.st;
  return T.rate.every(function (r) { return s.rate[r.id]; }) && T.recall.every(function (it) { return s.chk[it.id]; });
}
function starterNums() {
  var T = D.starter, s = S.st, n = T.rate.map(function (r) { return s.rate[r.id]; });
  T.recall.forEach(function (it) { n.push(s.ans[it.id] + 1); n.push(s.conf[it.id]); });
  return n;
}

}

}

}
function termCard(t) { return '<div class="term"><h4>' + t.name + '</h4><p>' + t.say + '</p><div class="ex">' + t.ex + '</div></div>'; }
function termsFor(ids) { return ids.map(function (i) { return D.terms.filter(function (t) { return t.id === i; })[0]; }).filter(Boolean).map(termCard).join(''); }
function ruleCard(r) {
  var rights = String(r.right).split('   |   ').map(function (x) { return '<div class="r"><span class="lab">Right</span>' + esc(x) + '</div>'; }).join('');
  return '<div class="rule"><h4><span class="id">' + r.id + '</span>' + esc(r.name) + '</h4><p>' + esc(r.say) + '</p><div class="pair"><div class="w"><span class="lab">Wrong</span>' + esc(r.wrong) + '</div>' + rights + '</div></div>';
}
function rulesBlock() { return D.rules.map(ruleCard).join(''); }

/* ---------- step panels (chosen by each step's kind) ---------- */
function whatCard(st, title) { return '<div class="card"><h3>' + (title || 'What happens') + '</h3><p>' + esc(st.what) + '</p></div>'; }
function deviceCard(d) {
  return '<div class="rule"><h4><span class="id">' + esc(d.id) + '</span>' + esc(d.name) + '</h4><p>' + esc(d.say) + '</p><div class="pair"><div class="r"><span class="lab">In the book</span>' + esc(d.ex) + '</div><div class="w"><span class="lab">Do not confuse</span>' + esc(d.not) + '</div></div></div>';
}
function devicesBlock() { return D.devices.map(deviceCard).join(''); }
function vTalk(st) { return banner(st) + whatCard(st); }
function vDevices(st) {
  return banner(st) + whatCard(st, 'Three literary devices') + '<div class="card"><h3>The device cards</h3>' + devicesBlock() + '</div><div class="card"><h3>New symbol for your Reading Log</h3><p>' + esc(D.symbolNote) + '</p></div>';
}
function vSpot(st) {
  return banner(st) + whatCard(st) + '<div class="card"><details class="tm"><summary>Need the device cards?</summary>' + devicesBlock() + '</details></div>';
}
function vRules(st) {
  return banner(st) + whatCard(st, 'Three comma rules') + '<div class="card"><h3>Commas</h3>' + rulesBlock() + '</div>' +
    '<div class="card"><h3>Terms in plain words</h3>' + termsFor(['sentence', 'subject', 'verb', 'opener', 'joining']) + '</div>';
}
function vWriting(st) {
  return banner(st) + whatCard(st) + '<div class="card"><h3>The parts of the paragraph, in plain words</h3>' + termsFor(['claim', 'concession']) + '</div><div class="card"><details class="tm"><summary>Need the device cards?</summary>' + devicesBlock() + '</details></div>';
}
function vWrap(st) {
  return banner(st) + whatCard(st, 'Homework') + '<div class="card"><h3>Field Guide jobs (about five minutes)</h3><p>' + esc(D.fgNote) + '</p></div><div class="card"><p class="lede">Keep both paper sheets and your Field Guide. Your tutor will take a photo of the back of sheet 1.</p></div>';
}

function vStarter(st) {
  var T = D.starter;
  if (!S.unlocked[st.id]) return banner(st) + lockCard(st.id, T.title, esc(st.what));
  var s = S.st, h = banner(st);
  h += '<div class="card"><h3>' + esc(T.p1Head) + '</h3><p class="lede">' + esc(T.p1Note) + '</p>';
  T.rate.forEach(function (r) {
    h += '<div class="rate"><div class="stem">' + esc(r.name) + '</div><div class="opts">';
    T.scale.forEach(function (lab, i) { h += '<button class="opt" data-a="srate" data-id="' + r.id + '" data-i="' + (i + 1) + '" aria-pressed="' + (s.rate[r.id] === i + 1) + '"><span class="n">' + (i + 1) + '</span><span class="t">' + esc(lab) + '</span></button>'; });
    h += '</div></div>';
  });
  h += '</div>';
  var rated = T.rate.every(function (r) { return s.rate[r.id]; });
  if (!rated) return h + '<div class="card"><p class="lede">Rate all three devices to go on to Part 2.</p></div>';
  h += '<div class="card"><h3>' + esc(T.p2Head) + '</h3><p class="lede">' + esc(T.p2Note) + '</p></div>';
  var shownCur = false;
  T.recall.forEach(function (it, qi) {
    var ck = !!s.chk[it.id], sel = s.ans[it.id];
    if (!ck && shownCur) return;
    if (!ck) shownCur = true;
    h += '<div class="card"><div class="cat">' + esc(it.cat) + ' · question ' + (qi + 1) + ' of ' + T.recall.length + '</div><div class="stem">' + it.stem + '</div><div class="opts">';
    it.opts.forEach(function (o, i) { h += optBtn(it, i, 'S', 'spick', it.id, sel, ck); });
    h += '</div>';
    h += '<div class="sure"><b>How sure are you?</b><div class="row">';
    T.confScale.forEach(function (lab, i) { h += '<button class="btn" data-a="sconf" data-id="' + it.id + '" data-i="' + (i + 1) + '" aria-pressed="' + (s.conf[it.id] === i + 1) + '"' + (ck ? ' disabled' : '') + '>' + (i + 1) + ' · ' + esc(lab) + '</button>'; });
    h += '</div></div>';
    if (!ck) h += '<div class="row"><button class="btn primary" data-a="schk" data-id="' + it.id + '"' + (sel == null || !s.conf[it.id] ? ' disabled' : '') + '>Check</button></div>';
    else { var ok = sel === it.ans; h += '<p class="pts">' + (ok ? 'Correct.' : 'Not this time.') + '</p><div class="explain' + (ok ? '' : ' warn') + '"><b class="h">' + (ok ? 'Right. Here is why' : 'Here is why the answer is different') + '</b>' + it.explain + '</div>'; }
    h += '</div>';
  });
  if (starterDone()) h += codeBox(starterNums(), 'Tell your tutor these seven numbers, in order', esc(T.codeNote));
  return h;
}

/* ---------- contests ---------- */
function vContest(k) {
  var C = CONTEST[k], st = S[k], stp = STEP[C.step];
  if (!S.unlocked[C.step]) return banner(stp) + lockCard(C.step, C.title, esc(stp.what));
  var h = banner(stp);
  var sc = D.scoring;
  h += '<div class="card"><h3>How the contest works</h3><p>Three rounds, three questions each. You earn <b>' + sc.correct + ' points</b> for each correct answer, <b>+' + sc.streakBonus + ' bonus</b> on your third correct answer in a row and on every correct answer after that until you miss (a streak carries over into the next round), and the tutor adds <b>+' + sc.roundWin + '</b> for winning a round. After each answer you see why it is right or wrong.</p>' + (k === 'P' ? '<p class="lede">The practice sentences are made up in the world of our book. They are not quotations from it.</p>' : '') + '</div>';
  if (k === 'W') {
    h += '<div class="card"><h3>Word cards</h3><p class="lede">Five words come from the opening of the book and four are words that turn up on the SAT and ACT. Read the cards first. Every question is about one of these words. Round 3 also brings back words from the Nation unit.</p>';
    D.vocab.forEach(function (w) {
      h += '<details class="tm"' + (st.go === 0 ? ' open' : '') + '><summary>' + esc(w.word) + ' <span class="lede">(' + esc(w.pos) + ')</span></summary><div class="wc"><h4>' + esc(w.word) + '</h4><div class="p">' + esc(w.pos) + ' · say it: ' + esc(w.pron) + '</div><p><b>Means:</b> ' + esc(w.def) + '</p><p><b>Root:</b> ' + esc(w.ety) + '</p><p><b>Similar:</b> ' + esc(w.syn) + ' · <b>Opposite:</b> ' + esc(w.ant) + '</p><p><b>In the book:</b> ' + esc(w.textEx) + '</p><p><b>Example:</b> ' + esc(w.usageEx) + '</p></div></details>';
    });
    h += '</div>';
  } else {
    h += '<div class="card"><details class="tm"><summary>Rule cards (C1 to C3)</summary>' + rulesBlock() + '</details></div>';
  }
  if (st.go === 0) { return h + '<div class="card"><h3>Ready?</h3><p>Wait for your tutor to say <b>GO</b>, then start Round 1.</p><div class="row"><button class="btn primary" data-a="cgo" data-k="' + k + '">Start Round 1</button></div></div>'; }
  var ri = Math.min(st.go, 3) - 1, round = C.rounds[ri];
  var cur = round.ids.filter(function (id) { return !st.seen[id]; })[0];
  var sc2 = cScore(C.items, cPicks(k));
  h += '<div class="card"><div class="row"><span class="pts">Points: ' + sc2.tot + '</span><span class="lede">' + esc(round.name) + '</span></div></div>';
  if (cur) {
    var it = C.items.filter(function (x) { return x.id === cur; })[0], ix = C.items.indexOf(it), ck = !!st.chk[cur], sel = st.ans[cur];
    h += '<div class="card"><div class="cat">' + esc(round.name) + ' · question ' + (round.ids.indexOf(cur) + 1) + ' of 3' + (it.rule && k === 'P' ? ' · rule ' + esc(it.rule) : '') + '</div><div class="stem">' + it.stem + '</div><div class="opts">';
    it.opts.forEach(function (o, i) { h += optBtn(it, i, k, 'cpick', cur + '|' + k, sel, ck); });
    h += '</div>';
    if (!ck) h += '<div class="row"><button class="btn primary" data-a="ccheck" data-k="' + k + '" data-id="' + cur + '"' + (sel == null ? ' disabled' : '') + '>Check</button></div>';
    else {
      var ok = sel === it.ans, pt = sc2.pts[ix];
      h += '<p class="pts">' + (ok ? 'Correct: +' + pt.p + ' points' + (pt.streak >= D.scoring.streakAt ? ' (streak bonus!)' : '') : 'Not this time: 0 points') + '</p>';
      h += '<div class="explain' + (ok ? '' : ' warn') + '"><b class="h">' + (ok ? 'Right. Here is why' : 'Here is why the answer is different') + '</b>' + it.explain + '</div>';
      h += '<div class="row"><button class="btn primary" data-a="cnext" data-k="' + k + '" data-id="' + cur + '">' + (round.ids.indexOf(cur) === 2 ? 'Finish round ' + (ri + 1) : 'Next question') + '</button></div>';
    }
    return h + '</div>';
  }
  // round finished
  var nums = round.ids.map(function (id) { return st.ans[id] + 1; });
  h += '<div class="card"><h3>' + esc(round.name) + ' complete</h3><p class="score">Round points: ' + sc2.per[ri] + '</p></div>';
  h += codeBox(nums, 'Round ' + (ri + 1) + ': tell your tutor these three numbers', 'They are the answers you picked. Your tutor types them in to update the scoreboard. Then wait for the next GO.');
  if (ri < 2) h += '<div class="card"><p>Wait for your tutor to say <b>GO</b>.</p><div class="row"><button class="btn primary" data-a="cgo" data-k="' + k + '">Start Round ' + (ri + 2) + '</button></div></div>';
  else {
    h += '<div class="card"><h3>Final points: ' + sc2.tot + '</h3><p class="lede">Round 1: ' + sc2.per[0] + ' · Round 2: ' + sc2.per[1] + ' · Round 3: ' + sc2.per[2] + '. Your tutor adds the round-win bonus on the big screen.</p></div>';
    h += '<div class="card"><h3>Review any question</h3>' + C.items.map(function (it) {
      var ok = st.ans[it.id] === it.ans;
      return '<details class="tm"><summary>' + (ok ? '✓' : '✗') + ' ' + it.id + ' · ' + esc(it.cat) + '</summary><div class="stem">' + it.stem + '</div><div class="explain"><b class="h">Right answer</b>' + it.opts[it.ans] + '<br><br>' + it.explain + '</div></details>';
    }).join('') + '</div>';
  }
  return h;
}

/* ---------- shell ---------- */
function render() {
  var app = $('#app');
  if (!S.who) {
    app.innerHTML = '<main><div class="card pick"><div class="brand">' + esc(D.meta.brand) + '</div><h2>Which letter are you?</h2><p class="lede">Your tutor will tell you. You only pick this once.</p><div class="letters">' + ['A', 'B', 'C', 'D'].map(function (l) { return '<button data-a="who" data-l="' + l + '" aria-label="Student ' + l + '">' + l + '</button>'; }).join('') + '</div></div></main>';
    return;
  }
  var tabs = D.steps.map(function (t) {
    return '<button class="tab ' + (isScreen(t) ? 'scr' : 'off') + '" data-a="tab" data-t="' + t.id + '" aria-current="' + (S.tab === t.id) + '">' + esc(tabLabel(t)) + (done(t.id) ? '<span class="tick" aria-label="done">&#10003;</span>' : '') + '</button>';
  }).join('');
  var KIND = { talk: vTalk, read: vTalk, starter: vStarter, devices: vDevices, spot: vSpot, rules: vRules, writing: vWriting, wrap: vWrap };
  var cur0 = STEP[S.tab] || D.steps[0];
  var body = cur0.contest ? vContest(cur0.contest) : KIND[cur0.kind](cur0);
  var foot = '<div class="card"><div class="row"><button class="linkbtn" data-a="reset">' + (S.resetAsk ? 'Tap again to erase this device and start over' : 'Start over on this device') + '</button></div></div>';
  var prevScroll = (document.querySelector('.tabs') || {}).scrollLeft;
  app.innerHTML = '<div class="bar"><div class="head"><span class="brand">' + esc(D.meta.brand) + '</span><span class="who">Student <b>' + S.who + '</b><button class="linkbtn" data-a="chwho">change</button></span></div><nav class="tabs" aria-label="Steps">' + tabs + '</nav></div><main>' + body + foot + '</main>';
  var cur = document.querySelector('.tab[aria-current="true"]');
  if (cur && cur.scrollIntoView) { try { cur.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {} }
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]'); if (!el) return;
  var a = el.getAttribute('data-a'), id = el.getAttribute('data-id');
  if (a === 'who') S.who = el.getAttribute('data-l');
  else if (a === 'chwho') S.who = null;
  else if (a === 'tab') { S.tab = el.getAttribute('data-t'); lockErr = ''; S.resetAsk = false; window.scrollTo(0, 0); }
  else if (a === 'cgo') { var k = el.getAttribute('data-k'); S[k].go = Math.min(3, S[k].go + 1); }
  else if (a === 'cpick') { var p = id.split('|'), kk = p[1], iid = p[0]; if (!S[kk].chk[iid]) S[kk].ans[iid] = +el.getAttribute('data-i'); }
  else if (a === 'ccheck') { var k2 = el.getAttribute('data-k'); S[k2].chk[id] = true; }
  else if (a === 'cnext') { var k3 = el.getAttribute('data-k'); S[k3].seen[id] = true; window.scrollTo(0, 0); }
  else if (a === 'srate') { S.st.rate[id] = +el.getAttribute('data-i'); }
  else if (a === 'spick') { if (!S.st.chk[id]) S.st.ans[id] = +el.getAttribute('data-i'); }
  else if (a === 'sconf') { if (!S.st.chk[id]) S.st.conf[id] = +el.getAttribute('data-i'); }
  else if (a === 'schk') { S.st.chk[id] = true; }
  else if (a === 'dpick') { if (!S.diagLocked[id]) S.diag[id] = +el.getAttribute('data-i'); }
  else if (a === 'dlock') S.diagLocked[id] = true;
  else if (a === 'unlock') {
    var t = el.getAttribute('data-tab'), v = ($('#codein').value || '').replace(/\s+/g, '').toUpperCase();
    if (v && btoa(v) === CODES[t]) { S.unlocked[t] = true; lockErr = ''; } else lockErr = 'That code is not right. Check the spelling with your tutor.';
  }
  else if (a === 'rank') {
    var n = +el.getAttribute('data-n'), kr = +el.getAttribute('data-k') - 1;
    var arr = [S.ranks[0], S.ranks[1], S.ranks[2]]; var old = arr.indexOf(n); if (old >= 0) arr[old] = undefined; arr[kr] = n;
    S.ranks = arr.map(function (x) { return x === undefined ? null : x; });
    while (S.ranks.length && S.ranks[S.ranks.length - 1] === null) S.ranks.pop();
  }
  else if (a === 'unrank') { var nn = +el.getAttribute('data-n'); var j = S.ranks.indexOf(nn); if (j >= 0) S.ranks[j] = null; while (S.ranks.length && S.ranks[S.ranks.length - 1] === null) S.ranks.pop(); }
  else if (a === 'lockvote') { if (S.ranks.length === 3 && S.ranks.indexOf(null) < 0) S.ballotDone = true; }
  else if (a === 'reset') { if (S.resetAsk) { S = fresh(); lockErr = ''; } else S.resetAsk = true; }
  save(); render();
});
render();
</script>
</body></html>
